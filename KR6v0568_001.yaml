body:
  text: 真現實論宗依論上十六年冬在杭州靈隱寺編敘論第一章能知現實之方法第一節現比真似一何謂現比真似二自相與共相三能知之現量心四現量之所知境五能知之比量心六比量之所知境七名之構成八辭之構成九論之構成十現比與真似十一現量之真似十二比量之真似十三似現比之概觀第二節算學略説一算學概説二數量概説三上座部之數量四俱舍論之數量五華嚴經之數量六空量之計算七時量概説八小時量之計算九中時量之計算十大時量之計算十一相對之時量十二相對之空量十三相對絶對之算學第三節聲明略説一聲明概説二梵文與聲明三何謂名句文身四文及文身五名及名身六字界字緣七蘇漫多聲八底彥多聲九名句間之六合釋十聲明之用與體第四節立破真似一立破真似概説二佛陀學之因明三佛陀因明學之實用四為他比量之三支五宗支之構成六因支之構成七喻支之構成八為他比量之第一分類九為他比量之第二分類十為他比量之構成十一似為他比量之過謬十二似能立與似能破十三真能立與真能破十四立破真似刊定第五節聞量與能知方法之評判一聞量概説二四依四不依之標準三歷史之考證四法印之楷定五佛陀學之內容六所聞言義之揀判七所聞言義之攝判八能知方法之評判九求學之目的十求學之方法第二章所知現實之成事第一節所知有情一何謂有情二有情略分類三有情中分類四有情廣分類五有情類之生起六有情類之流轉與進化七有情身之産生八人身之胎生觀九有情身及人身之生存位十有情及人之身量形狀十一人身之生理形態十二有情身之化學素十三有情眠覺等位心理十四有情身之老病死及尸處置十五有情身之生活資具十六有情與有情之相處十七有情之語言文字十八有情類之教育第二節所知器界一所知器界概論二此一人間之器界三人地與天象之關係四此日系中之他處人生器界五日系中神生天生之器界六太陽系外之天生器界七一小世界之成住史八日系諸星之空間測量九地球等上之異生器界十此大千界與無量器界十一器界與有情之關係十二人生與器界之依資第三節所知情器一所知情器概論二動植礦之關係與區別三人間情器與非人間情器四有情與器界之關係五人間之有情器界六人生世界之我與非我七現代之人生世界觀八太陽系之小三界九轉輪王界變遷史十大千界之大三界十一大千界之九地十二大千情器之所餘分類十三索訶界外之十方情器第四節超情佛剎一超情佛剎概論二佛剎之分類三此大千界之應生佛史四地球之應化聖地五此小世界之勝應聖剎六大千界之勝應聖剎七索訶界外著名佛剎八索訶界外無數佛剎九情器及佛剎之十法界第五節所知成事評判一所知成事評判緒言二有情托胎識問題三有情中有身問題四有情之心理問題五器界之蘇迷盧等問題六情器之生命由來問題七超情佛剎之餘義第三章所知現實之蘊素第一節大蘊處界一四大與六大二大乘四大種之勝義三情器之五蘊四十二處之分別五六根與二十二根六十八界之分別第二節五位百法一五位百法概論二識自性位三識相應位概論四五遍行心所五五別境與四不定心所六十一善心所七二十六煩惱心所八二所變位九三分位位十四實性位十一百法之分系表第三節諸法相攝一諸法開合概論二六大與諸法比觀三五蘊與諸法比觀四十二處與諸法比觀五十八界與諸法比觀六百法與大蘊處界比觀七百法與俱舍七十五法八百法與錫蘭八十三法九心所有法之論定十心不相應行之論定第四節諸法施設一諸法施設概論二有情事之五蘊施設三受用處之十二處施設四依生存事之四食施設五依差別事之諸界施設六依生起事之緣起施設七依染淨事之四諦施設八依六事所施設之蘊素九六事施設與六百六十法第五節所知蘊素差別一所知蘊素總評二五蘊與心理學三心識與根身之關係四心法體數之決擇五命根之研究六性之研究七新百法之決擇第四章所知事素之關係第一節因緣生果一因緣生果概論二因緣生果與業力三因與緣之定義四因之分析五緣之分析六果之分析七因與緣及果之關係第二節因緣情器一因緣情器概論二情器之十二緣起三巴利文之業感緣起説四俱舍論之業感緣起説五三世緣起之惑業苦環六通大乘之無明緣起説七法相大乘之二世緣起説八二世緣起之因緣果辨九二世緣起之業力説第三節因緣佛剎一因緣佛剎概論二四諦與修三增上學三七賢與四向四果四境行果與三祇五位五三慧與三智六三因佛性與緣真二修七起信論之真如緣起説八維摩詰等之創造淨土行九託於有漏之無漏因果十佛剎之因與緣分析第四節因緣法界一因緣法界概論二因緣所生心法三因緣所生心所有法四因緣所生色法五現生種之種義六現生種之熏習義七現生種之因緣八種生現之因緣九種生種之因緣十現生現之因緣十一現行法作諸緣義第五節所知關係評判一所知關係概論二事素關係與因果三因緣果名義之決擇四佛剎緣起之討論五因緣法界之討論六緣起決擇之概論七緣起決擇之新釋八別釋意識緣起九別釋心識緣起十緣起決擇之結論第五章能知所知之決擇第一節能知方法之決擇一能知決擇概論二四道理之建立三四道理之略解四證成道理之廣釋五四悉檀之名義六四悉檀之作用七四悉檀與行位八至教量之差別相九歷史考證之決擇第二節所知成事之決擇一有情衆生之決擇二情器世間之決擇三情器世間之苦相四情器世間之業相五情器世間之煩惱相六人間之上中下士七人間政治領袖之德失八超情佛剎之決擇第三節所知蘊素之決擇一蘊事之決擇二色蘊之別決擇三極微色之決擇四色業之決擇五名所攝四蘊之決擇六界事之決擇七處事之決擇八諸法分位之決擇九諸法善染無記之決擇第四節一切所知之決擇一因與緣生果之決擇二親因之決擇三種子之決擇四勝緣根之決擇五諸緣之決擇六緣起支之決擇七三世業果之決擇八色物之生緣九色物之住緣十色物之剎那滅十一三有為相之決擇十二處非處之決擇第五節能知所知之關係一能知所知關係概論二瑜伽四真實義三四真實義之今釋四世俗勝義之差別智境五三相三無性之智境六能知心上之所知諸法敘論一現實即宇宙有事實而無邊中之謂宇有變現而無始終之謂宙用名數心想割畫於宇故説為點線面體説為上下縱橫説為空間方分而宇非點線面體非上下縱橫非空間也用名數心想割畫於宙故説為忽秒分刻説為古今往來説為時間而宙非忽秒分刻非古今往來非時間也將宇宙一部云世界世界非宇宙之全稱即人生全部云宇宙人生非宇宙之對稱宇宙者何現實而已現實者何宇宙而已有變斯有現無現則無變無變非現無現非變續變續現續續自住攝十世曰永宙一念衆念自住永宙非永宙莫觀乎變現有事斯有實無實則無事無事非實無實非事各事各實各各互遍入十界曰大宇一相衆相互遍大宇非大宇莫觀乎事實觀各事於續變是謂宇宙觀永宙於大宇是謂現實然不名宇宙而言現實者宇宙曾被説為方體時刻或被説為世界而與人生對稱易致誤解故今捨而不用且猶有餘義唯現實一名能詮故曰現實二現實即法界法謂軌持軌範他解任持自性增損其範軌則迷謬變失其任持則滅亡界謂總分總包至無分析窮有總包至無故包無及有而有無盡包分析窮有故析有竟無而無有皆析總包言之諸法可以一名舉也分析言之諸名亦難一法宣也非法軌莫究其別異非界總莫得其通同非法持莫顯其恆成非界分莫悉其變壞故法界者一切法之總和非別指任何一法若真如等之特稱亦非任何一法若心等可與對稱又法界者一一法之分函任何一法皆遍入於諸法任何諸法皆攝住於一法此總別同異成壞六相為法界一名之根本義別有增釋見於餘處非法界六相莫觀乎現實非現實莫觀乎六相法界法界即現實現實即法界然名現實而不云法界者法界一名義詮隱幽現實一名義詮顯了且猶有餘義唯現實一名能詮故曰現實三現實即現實現變實事曰現實無始恆轉故現事實性曰現實無性緣成故現性實覺曰現實無相真如故現覺實變曰現實無元心樞故現實即現實現實唯現實更無他名能詁之也故曰現實四現實主義乃佛陀無主義之主義何謂現實主義即是無主義耶現實真是如此契知現實真是如此現實真是如此法爾如是亦曰本來面目亦曰真如宣説現實真是如此知亦現實真是如此不知亦現實真是如此説亦現實真是如此不説亦現實真是如此知不知等説不説等知即無所知説即無所説不同其餘任何主義別有所執別有所立故現實主義即是無主義何謂現實主義即無主義之主義耶現量實相雖無可知由現量如實相而知根本智境實相現量雖無可説倣實相如現量而説後得智境雖自無可説而隨機有説雖隨機有説而契理應真如實或如如故雖無主義而即為無主義之主義然又何謂現實主義乃佛陀無主義之主義耶除佛陀外莫不為非現實而有主義之主義故宗教執唯神故哲學與科學執唯我或唯物故實驗主義或實際主義實用主義又現實主義實證主義似為現實主義然未脫唯我或唯物之執孔家哲學似為現實主義然未窮現實之量而猶有拘局故唯佛陀為無主義主義之現實主義者而現實主義雖鏡涵萬流含容一切要非佛陀不足以正其名義也以簡別世俗現實主義故名曰真現實論現實之為現實真現實之為真現實既正其名既明其義乃分宗依論宗體論宗用論之三編以究其詳第一章能知現實之方法真現實論為現量實相之説明依能知現實之方法與所知現實之事理及能知所知之關係以為材料於是有宗依論今言現實必先知於現實云知現實必有能知於現實之方法故首論現比量及其真似比量所用工具一為形數度量二為言語文字故依次説數量聲明對於現實已能自知且已完備所用工具則能發表悟他悟他在破其似而立乎真故次又論立破真似今由立破真似可有悟他之功則古近遺傳之教義應亦有悟他之功用可資依據然當評審批判別其真妄偏圓故有遺教評判今以如此方法謂能令自及他知於現實與古近人能知方法應為比較研核故有方法評判集此六事乃完成能知現實之方法然此能知方法同時亦為所知現實凡所知有非能知者能知無不是所知故第一節現比真似一何謂現比真似現謂現量比謂比量真謂真現量真比量似謂似現量似比量量是規矩繩墨準確刊定之義諸正確之知識概名曰量昔有佛陀學者陳那作集量論分析量之種類於古傳之諸量或廢或合僅存現比二量於現比中之純真或貌似又分真似此即今茲之所言也能知之量唯現比之二者以所知之境亦唯事理之二故事曰自相能知者曰現量理曰共相能知者曰比量現量亦云現知謂於現在事顯現證知故比量亦云比知謂於比類理推比決知故顯現證知者恰當於事之自相曰真現量推比決知者恰當於理之共相曰真比量貌似顯現證知而不恰當於事之自相者曰似現量貌似推比決知而不恰當於理之共相者共相猶云概念亦猶科學所云公式曰似比量今欲求能知現實之方法即在如何辨別真似離似而即真耳於現實中除自相之事及共相之理更無可知之境故能知之量亦不容至於三也二自相與共相一一現變實事一聲至一地球其各自體及其別義各唯此事不通餘事譬如現聞一聲聲亦依共相理所立假名通餘一一聲故現所聞聲實離能詮之名及所詮理然今假借以但指現聞之一聲便立言耳不關餘一一聲是謂事之自體自體猶云本身現聞此一聲事變現即滅變現即滅猶云無常亦依共相理所立假名在現聞聲實亦離此名理今亦假借為説便立言耳不關其餘一一事之變現即滅是謂事之別義一一事之自體及其別義統名自相之事自相唯是一一事離言之現實若事體事義之貫通於餘一一事者如縷貫華即為一一諸事之共相理如説曰聲聲之一名所詮事體通於人聲鳥聲樹聲風聲以及他星球聲曰共事體又曰變現即滅此言所詮事義亦通於一一聲及餘色香等上曰共事義一一事之共體及其共義統名共相之理於此有顯然可知者共相之理必依自相之事而立一也自相事唯是於現在事顯現證知之離言現實二也能詮理之名及名所詮之理皆由推比決知之共相而立者三也假名但能詮共相之假理不能詮自相之實事四也依假名理所成假智亦但能知共相名理而不能知自相實事五也統此五義則孰為事量所知之自相與孰為理量所知之共相皆可知矣然尚有難言者則世人混於假説之自相共相而不能分辨也於假説中此一聲為自相則餘一一聲為共相然以諸變礙事色法為共相時聲亦可云自相更以諸實事體色法及心心所為共相時變礙事亦可云自相更以諸事及義義指分位及和合相續之假法為共相時實事體亦可云自相更以諸變事及不變為共相時諸事義亦可云自相更以諸有及無為共相時則諸有亦可云自相自相共相重重差別無定類與不類相與為類別與不別相與為別類之無盡別之無盡然此假説中之類別皆共相中之差別相所云自相非真自相知真自相離名理等唯是現量所證知之實相故曰現實即是現量實相仿現量實相而起推比所知之假相而有共相差別相等名理即事實而觀其變現則為因相即變現而觀其事實則為果相故曰現實即是現變實事假依於實實不可説説皆唯假假不離實是謂現實之自相共相差別相因相果相而不同於執假為實之倒見也三能知之現量心若能知心於現知境無有遮隱迷亂如光顯色各別顯現分明證知一一事之自相則為能知之現量心剋實而言唯有離二執障時之淨智相應心品方是真現量心然在因明家之量論須共通俗不同佛陀學之內明故説四類一者依色根之前五識現量心官覺依眼耳等根覺色聲等自相故二者依意根之第六識現量心謂與前五識同時起之第六識亦明了覺知一一色聲等之自相故三者此諸識心及相應心所等於現知時一一各自證知之自證現量心凡起一心及一心所各自知故一一心及心所各自知其自相四者依意根識定心相應心品之現量心定心於定境中不論觀事體與事義皆離共相之名理等各別顯現故皆證知境之自相此四皆為俗間及佛陀學內明共通之現量心俗間即以凡境一一事義自相為所知故佛等即以聖境一一事義自相為所知故而第四定心相應之現量尤為溝通俗間與內明之樞要離我法執及煩惱所知障之淨智亦依之起故今之現實主義即為內明故應更説內明現量一者一切種識之現量心於攝持之一切種子及變現之根身器界一一了知其自相故二者離二執障之淨智相應心品現量心此通妙觀察智等之四智相應心品了一一事體事義自相故前者不共凡愚愚指小乘後雖不通凡俗然與小乘聖者或通不通或通者離我執煩惱障之淨智不通者離法執所知障之淨智唯大乘聖者能有故故內明之現量較前四現量大有勝劣之差別然前四現量平等為比量所依人間以至佛陀無勝無劣以比量之為用或明俗事或明勝義皆不定故今為了知現實而説明現實故將以現量作比量之所依以為立正破邪之據則必依人間共同承認之現量乃可為是非裁判之標準故所宗雖在內明之現量而同時亦兼重因明之現量也四現量之所知境有現實事義顯現境乃生現量之心故現境為現量之因由現量知所知事義乃呈顯現之境故現量為現境之因此即陳那於觀所緣緣論所謂同時是緣亦是所緣者也故理門論説顯現境亦名現量是現量之所因及所知故諸現量所知境即是一一事體事義自相然須遠離四事以為其相一者不現見事如日光映奪時不現見之星月時彼星月為憶念相非顯現境二者惑亂覺事如在舟中於舟行時見岸移動而岸移動為幻覺相夢境同之非現實境三者錯謬覺事如暗夜中見繩疑怖是蛇彼蛇為錯覺相非顯實境四者名相所分別事即諸共相名理種類差別及於實事增益餘相餘義之所施設蔽失一一事義自相非顯現實事境遠離此之四事乃為現量之所知境故現量之所知惟是諸現量心各各現證知之一一事義現實自相五能知之比量心除現量而外所餘之正確知識概曰比量恰同近人所云理智人間以至佛陀共通之比量心唯在依意根起之第六識各人之第六識皆有與前五識同時了一一事義自相之現量境故得依顯現證知之事義自相或已曾推比決知之事義共相據以為因以推比未知之事義決知其共相事義之通理何屬乃得建立名言詮此共相之理貫通於彼諸多事義故推比決知比量之方法在以第六識中尋觀伺察之二種心作用粗觀概略細察幽微以推度比核彼諸多事義中之相關係者而決定其共相理公例之何在此由推比得決之能知心是謂比量凡遇一未曾決知事當前先觀得其共餘事之一重要關係點為此事遍然之關係因三相中第一遍是宗之因法之相從而察得彼一關係點若有時定有某義同品定有相某義若無之事上決無此一關係點異品遍無性於是以此事既有彼一關係點即可決知此事必為有某義之諸事同類例如觀得聲由臍喉舌等鼓動所作成之一重要關係點而若有作成之關係定有變壞之無常義若無變壞之無常義必無有作成之關係由是既知聲有作成關係即可決知聲亦必為無常變壞之同類事此唯不同西洋邏輯印度因明之三段法而同中國墨辨之二段法見所著之墨子平議其式如左聲是作成邏輯之小前提因明之因凡作成之事必變壞無常邏輯之大前提因明之同喻體不須先立因明之宗或後加邏輯之結也故在為成立自心之比量正知莫簡捷於墨辨然為舉以曉喻他人他比量則又須以因明之三支法為最靈便完備此待於立破真似節中再言之西洋論理學中之歸納法即此成立自心之推比決知法乍觀一事得其一關係點更尋觀於有彼一關係點之未曾決知事合之已曾決知事中之有彼一關係點者察其以各各有此一關係點故必為同有某義之事乃由所觀此事及推觀之各事以各各有彼一關係點故必為有某義事之同類事例此聲及各聲與瓶盆等同為無常變壞之物得成明決之知識也要之能知之比量心乃第六識和同現量憶念尋觀伺察等心作用於一一事義推比諸多事義後得成之明決知識也所謂隨憶念隨計度之分別是六比量之所知境比量之所知境即為共相差別相等之理詮表此理則為名等所謂分別所分別之相與名是若比量中相區別前現量中相則可名現量中之相曰事而別名比量中之相曰理理為名之所詮表者名為理之能詮表者依理立名辭等依名辭等顯理無理則無名等無名等亦無理無名等理則無分別無分別亦無名等理名辭等與理及分別三者和合乃成比量若缺其一即不成就故比量智亦曰理智云理智者以比量之境名比量者也比量境理理即是境則獨影境及帶質境對現量之事自相境性境則皆為共相理共相即理理即共相共相理境共有大小大共對小共有不共小共對大共有不共小共對小共有不共大共對大共有不共最大共則都無不共一元論之一元最小共則但有不共共中不共曰別不共中共曰類類至無不類則無別無不類別至無不別則無類不別類別別類則為比量境中依共相理所增起之差別相理依一類或一別之差別相理境觀其藉以生成之衆關係則為比量境中依差別相理所增起之因相理即觀彼衆關係所成之差別相則為比量境中依差別相理所增起之果相理共差別相觀諸事實遍無不盡是謂大宇因相果相觀諸變現遍無不盡是謂永宙要之非自相事不得有共相理故比量境必依現量境起非共相理不得有差別之相理故差別相理依共相理起非差別相理不得有因果之相理故因果相理必依差別相理起反之則無共相差別相因相果相理亦無自相事可以名理等分別説之故自相事遠離名理分別而分別言説之即為名理而非自相之事以之凡可分別言説之名等所詮理皆為比量所知境理然比量所知境理皆詮在名等故今當就名等更詳論之七名之構成如吾人噭然而曰犬用茲犬之一名名一現觀之物則亦以吾現觀之此一物與吾曾知之犬相類或其形色相類或其質觸相類或其吠聲相類或其活動相類或其表示於聲動之心態相類吾乃將此所現觀之一物納入吾憶念中所曾知之犬共相中一共相理即一概念名之曰犬若察其但有形色之相類則名犬畫犬影而不得名犬也若察其但有形色質觸之相類則名人造物犬而不得名犬也雖察其亦有聲音活動而無表示之心態則名人造機器犬而仍不得名犬也此為犬共相內非真犬之分別使其為真犬也或疑曰羊然又當憶念吾曾知之羊共相辨其形色非羊質觸非羊聲音非羊動態非羊心態非羊乃得決其疑曰此必是犬而定非羊對於疑曰羊者如此對於疑曰牛者馬者人者樹者石者雲者如是乃至歷窮一切名物皆可如此此為犬共相外非犬類之分別盡此內容及外延之類別對於此一物屬於犬共相乃得疑斷信成名之曰犬故加一物以名其名必經比量乃獲構成其式如下此一物類吾人曾知之犬因小前提既類吾人曾知之犬應是犬同喻體大前提夫以一名指稱一物習若甚易乃必經許多之推比始獲決知而下此是犬之結論宗名之曰犬竟如是艱難也然此猶以憶知中有約定俗成之共相名為所依者若使吾人新遇一物於習俗中既無成名可以名之吾曾知之名物中亦絶無其相類者雖可創製一名名之然欲使此創製之名盡能詮表此所名物共相內共相外之類別理必察盡此物共相內之別以類其內又辨盡此物共相外之類以別其外極成為是此非餘之概念確能以此名詮此概念概念即物此名乃為成立既為他日重遇此物同類之物可加之以此名亦為曉喻他人可用此名以説明於此物凡此或以曾知之類名名現觀之物或觀新遇之物而創新名以理立名以名詮理名物即名理之構成皆經比量決然可知之矣名有遍名者前所謂最大共則都無不共也名有獨名者前所謂最小共則但有不共也名有類名者為有不共之大共名若言生物對無生物為不共對生物為共名有別名者為有不共之小共名若言人生對旁生等為不共對人等為共類上有類則類名可退為別名別下有別則別名可進為類名雖進退之無定其為類名別名無異剋實言之唯有類名別名無遍名與獨名中國之物似為遍名其廣義無不可名為物故然物仍與非物相對非物即無物之一名不遍於無即非遍名使為遍名則吾人在分別記憶中即不能有物名之概念佛學之法似為遍名有曰有法無曰無法雖無亦可名為法故然法仍與非法相對使為非法吾人分別憶念中即不能有法名之概念然今姑以法為遍名在一一神教於所奉之神似為獨名然合其餘神教所奉之神則亦為類下之別名或別上之類名在一世界之日似為獨名然日為恆星而類於日之恆星太空中不知有若干千萬故日亦為類中別名一人姓名似為獨名而古今亦多同此姓名者故亦可為類中別名然今姑以若孔丘若釋迦牟尼等為獨名遍名但便總持不彰比量之理獨名但便稱呼亦無比量之理故比量之理智著於類別之名八辭之構成辭者主位賓位前陳後陳兩事義名多事義名合成者亦作兩事義名看綴以一中介名若是或非等名觀主位名物所關係名物判定是否與賓位名物有無關係也例云聲是無常聲是事共相名此居主位無常則是義共相名此居賓位綴以中介是之一名構成一辭乃判定主位聲事必有賓位無常義之關係由是聲事可入有無常義事之事類若舉無常物名聲事即含無常物名之內此明由別成類之比量理例云白馬非馬馬者馬之全類白馬者乃馬類中之一別二者均為事共相名主位之白馬名與賓位之馬名所詮之共相理概念實有不同綴以中介非之一名構成一辭於是白馬別為一類應名白馬不應但名曰馬若但曰馬不得即是白馬此明由類成別之比量理舉此二例辭所詮理之比量境大抵皆可知矣然一辭中之主賓位居之者不限定是何名物前舉二例一為聲事名居主位而無常義名居賓位事主義賓一為白馬事名居主位而馬事名居賓位主賓皆事然義名居主而事名居賓亦可例云是非由人是非是義名而人是事名義主事賓亦可主賓皆是義名例云無常者必無我無常是義名無我亦義名主賓皆義現量中事自相義自相皆曰事比量中共相事共相義皆曰理此中論比量境須知所言事義皆共相事義之理耳然名與辭有不同者名但能詮共差別相辭亦兼能詮因果相例云以境有故心有或心有故境有以境有詮心有之因相故心有詮境有之果相此因果相必成一辭乃能詮表若在於名曰心曰境則境名與心名均不能詮表因果相理也九論之構成綴名成辭連辭成論凡詮表類別相或因果相本祗一辭便可然或自疑未決或因他疑待解則須推比更求解決例云聲是無常或疑何以知必無常或反詰曰何以知聲非常則須推觀有此關係則必無常之已知共知關係點若作成等在聲有否聲若有所作成性等則聲決是無常而非是常然今已知現知共知語聲是喉舌等鼓動之所作成作成者必無常則可曰聲是喉等所作成故聲無常設因所含之意猶未充分表示自疑他疑尚須解釋則當舉現事以為之證決曰瓶盆等諸由造作成者現見是無常故聲既由喉等所作成亦必無常且真空等諸是常者共知皆非由任何所作成聲既由喉等所作成故非是常如此推比之後則辭盡而疑絶可決知聲是無常必非是常矣如此推論之論其所詮理實為比量所知境之究竟亦為推比決知之所以為決定知識者也然在推比以自求其決知或不須如許之形式或但如此已足完成故或如墨辨之二段或如法稱正理方隅及耆那教徒等謂但能顯宗因二分之不相離即得決定而喻分為可廢除也若在令他曉悟或摧敵論則須依立場及對方之關係上更增規律以盡利用而此等在今自求決知中則為無用故法稱等後期因明學者對於陳那商羯羅等所定因明規律或有減廢待於立破真似節中再詳積論以成篇章乃至聚成一書則為論聚所成推比決知之所知理無加於論謂之論聚仍得論稱故今以論為比量所知境之極所知共差別相及因果相至論已決成故十現比與真似諸正確之知識不能逾越現量比量現量知自相事比量知共差別因果相理所知事理已盡所知境故越此更無可知境故現量比量括盡諸正確之知識若然則人間何故有許多不能以現量比量審檢之知識不可歸入現量比量中耶答曰此為幼稚現比量之謬似知識故不能與長成現比量之真正知識齊一發生抵牾然幼稚現比量知識亦現比量知識非逾越現比量之知識也特未能上齊長成現比量知識之程度耳謂之似現比量知識非現比量外另一種之知識也學者間或以似現比量知識稱直覺直覺者不待推論而直接知覺之謂然真現量固不待推論而直覺習之極熟之真比量亦不待推論而直覺若佛陀之不有尋伺直覺不限於幼稚現比量知識而長成現比量知識尤富有其直覺特人間一般之直覺多為幼稚現比量之知識而已知人間一般之直覺多為幼稚現比量之知識則可知其不能以長成現比量知識檢定之故知幼稚現比量之為謬似知識則知其為似現比量知其為程度幼稚之似現比量則知無現比量外之知識而現比量特為長成之正確知識耳在有長成現比量正知者亦唯施祛似謬顯真正之教育以提高幼稚程度使之長成爾然教育兒童者須察兒童心理順兒童心理為本位引之漸令長成今對人間一般幼稚知識亦應察知其幼稚知識之狀態順之導令長成依真化俗俗即人間或有情間一般直覺知識依俗達真真俗互依而不分離即今現實主義之佛陀學然幼稚與長成無一定之分界幼稚生為幼稚小學生為長成小學生為幼稚中學生為長成中學生為幼稚大學生為長成大學生為幼稚大學研究生為長成研究生為幼稚大學博士教授等為長成人間假定以博士教授為長成若以功成道就之先覺者乃為長成則大學博士教授等猶為幼稚今在知識亦然以一般學者比量理智為長成則一般常俗直覺為幼稚以未離執障者少分現量智定心現量為長成則一般學者為幼稚以離一分執障真現量淨智為長成則未離執障者皆為幼稚以全離執障者之淨智為長成佛陀則未全離執障者亦皆為幼稚幼稚之與長成程度相差如此懸遠且愈幼稚者愈多而愈長成者愈少故真似之辨每不能即決然今且依一般學者知識以導一般常俗知識而漸近耳猶之學校教育且依小學為基礎也十一現量之真似前言現量即言學者以上所共通承認之真現量也常俗幼稚直覺之似現量猶廣流行若迷信人間之大地與天相對日球繞地運行其執信之堅決固曰吾人莫不現見如此也然在真現量中之自相事實無彼所執信之理彼理乃由誤推妄比積習傳説所集成之謬理概念曉之以學者推比決知之正理可曰汝所執者實非顯現證知之事乃依舟運岸移般之幻覺加以推比積以習傳而成之謬知也而地實為繞日以行之一星球又迷著人間之各個人物執各為整個之一個實體其執信之堅決固曰吾人莫不現見如此也然在真現量中之自相事實無彼所執信之理彼理亦由誤推妄比積習傳説所集成之謬理曉之以學者推比決知之正理乃曰汝所執者實非顯現實知之事乃依見繩為蛇般之錯覺加以推比積以習傳而成之謬知也而各個實為多事和合捷變相續之集團略舉二例可知在理智學者之長成知識觀常俗直觀之所謂現見為如何幼稚謬似矣然理智學者似現量之謬知猶在也假定聲及光等之傳達須有所依託而日傳達地球所經過之間亦必有其所依乃推論彼所依者為以太在假想上假立以太以為説明上之便利本無不可乃旋忘其為推論設想之假理而執為顯現證知之實事謂現實事變皆由以太波動而變現則倒執比量假理為現量實事不能謂非幼稚之謬似現量矣又可分析證知之原質略得八十種上下而不能謂此種原質更不可分析也則假定更有占空間最小點之分子原子電子分子是原子之集團原子是電子之集團電子亦仍為一集團立為假説以便利於分析觀察亦無不可乃旋忘其為推論設想之假理而執為顯現證知之實事實證所得謂現實事變皆由電子等集合之所變現則倒執比量假理為現量實事不能謂非幼稚之謬似現量矣略舉二例可知在佛陀學者之長成正知觀學者直覺之所謂實證為如何幼稚謬似矣在今之現實正知者則依現量而知之自相事現量實相而以比量施設名物名物之單素亦遵現量所知之自相事而以比量施設分析共相名物與分析單素之關係成事與事素之關係亦循現量所知之自相事而以比量施設説明不增益亦不為減損增益者如前述其減損者各心心所為各自顯現證知之最明確現量事而近今若行為派等心理學者減損遮撥為無尤違現量所知之自相事而正知現實者則有言其有無言其無假言其假實言其實而不增損也是為現實主義者應用現量之能知現實方法十二比量之真似前言比量亦言學者以上所共通承認之真比量也常俗幼稚直覺之似比量亦廣流行若迷信人間以上有一創造人間而主宰之者字之曰上帝謂人間乃彼在七千年前所造成者統治迄今而無有已就而詰其因何知有此創造主宰者之神則以原始之人祖必有所從生而器皿等必有造作主宰之者今此人間亦然故必有神生造主治而學者曉以比量之正理則曰人間從質力礦植動等所演生之自然物絶無創造及主宰者之神汝所執者乃依錯覺而妄計誤傳之謬説常俗又迷著各人之肉身如一房屋內有為之主者身死則猶屋主出屋而他去胎兒生則猶屋主造屋而居住號曰靈魂神我就而詰其因何知此身內有主我之靈魂則以能記憶數十年經驗不忘及夢時他去醒時復歸與活知求樂排苦死尸不知等故知身內決有為主之我號曰靈魂而學者曉以比量之正理則曰人身由父母等遺傳及質力生機等組合與環境教育等適應乃成記憶知覺活動等心作用汝所執者乃依幻覺而妄計誤傳之謬説略舉二例可知在理智學者之長成知識觀常俗比量之所謂決知為如何幼稚謬似矣然理智學者之似比量謬知猶在也推觀原子等皆不離質力而有感覺演為礦植動物以至人生故亦有不相分離之物理生理心理作用見赫凱爾一元哲學以為理智上之方便雖屬需要乃倒執質力感覺三位一體之一元實物彼曰實質或唯物的一元以為推論之所必有昧其為推想之假名假名概念或假名物則不能謂非幼稚之謬似比量矣推觀人生等在可能範圍內有自由活動之意志力以為吾人持身處世修行進化中能自選擇及趨向之策源地以為知行上之方便雖屬需要乃倒執先天良心無上命令之道德律為吾人行為最高至善標準見康德之實際理性批判以為推論之所必有昧其為推想之假名則不能謂非幼稚之謬似比量矣可知在佛陀學者之長成正知觀學者比量之所謂推斷為如何幼稚謬似矣在今之現實正知者則不逾越比量所知之共相理現變實事現事實性現覺實變而依現量施設名物名物之單素亦不逾越比量所知之共相理而依現量施設分析共相名物與分析單素之關係亦不逾越比量所知之共相理而依現量施設説明不增益亦不為減損增益者如前述其減損者各有情者之利他害他業感或福或禍之報復固為依現變實事之推論上可決知之因果相而近今若唯物派等虛無學者馬克司等屬之減損遮撥為無尤違比量所知之共相理而正知現實者則有言其有無言其無假言其假實言其實而不增損也是為現實主義者應用比量之能知現實方法十三似現比之概觀非真莫辨乎似而似亦可顯真常俗之似現量似比量多由錯覺及隨憶念分別之所習成學者之似現量似比量多由幻覺及隨計度分別之所習成常俗既非無幻覺及少分之隨計度分別學者亦非無錯覺及少分之隨憶念分別幻覺不知其幻即為錯覺之錯若愛恩斯坦相對論則庶幾能明幻覺之為幻覺而漸除於幻覺境上錯執為實之妄計知其為幻而觀其幻如吾人之觀電影然亦何害乎詩歌音樂圖畫戲劇等文藝皆覺其為幻而樂其幻者愚者執為實事則迷謬矣故常俗曰人曰佛陀曰瓶曰地球而正知者亦隨順之曰人曰佛陀曰瓶曰地球稱名雖同而愚者各執為實物事正知者了其為假名理猶愚者執電影為實智者則知其為幻影固倜然不同也為此今正知現實者雖同此現實而與一般學者之所知不同亦猶同此現實而學者所知與常俗不同然現實正知者固希望常俗間之妄執謬習能漸為學者間一分正理之所改轉同時尤希望學者間一分謬執能漸為現實正知者之所改轉於是由似現比謬知漸成真比量之正知依真比量之正知而內觀人間外察萬有盡一切現實界久之直覺皆如電影之幻或增或損之種種迷謬執無力再得生起由是漸能引發離執障之真現量智顯現證知一切事義自相之離言境真如現知現實現量實相自悟悟他夫人間知識之猶在幼稚謬似之程度內稍能虛心不躁之學者當無不自知且公認之則未可執今世初步科學方法而自限知識之進步且當精進於更進步之現實主義方法高等科學方法求真正之知識豈非今之學者所應努力者乎第二節算學略説一算學概説在現量中事體義之自相雖亦不無自量但時空數量之各種計算方法既用不著亦用不進故現量自相為超一切量之超量事然吾人之思想分別言説名相既皆為比量共相理而用推比來決知時首要之工具即數量否則將無推比可能何從以求決知換言之即無運思想施言説之可能故比量共相理之思想言説皆從數量起野蠻及旁生動物等縱無言語文字知相而不知名然亦必有簡單數量思想蓋猶在言語文字之前也由希臘古哲學有以數量為發生萬有之本者較之老子以有名為萬物之母僅明人文思想之所由起更為深廣近世以批評哲學著名之康德以十二範疇為先天思想而歷來科學皆以算學為基礎非無故也然皆比量理而未觸現量事也老莊等強名現量事為道為一或無名之朴及自然而曰一生二二生三三生萬物二者天地之二三者天地人之三才以人仰天俯地而生萬億名物老孔共通之易則一太極生二陰陽二生四太陰太陽少陰少陽四生八八卦八生萬象殷周相承之洪範則以一三五七九之奇數而推演要皆以一為生起之所依然真現量中之自相事義非多非一一亦不存而真比量中之共相事義亦一亦多多亦並著故在比量理中謂一生二以至多其實亦應謂由多或二以生一近人考諸野蠻民族有僅知以手指計數而知五者五以上則謂之曰多有僅知以爾我計數而知二者二以上則謂之曰多然絶無有不知多與二而但知一者由此可知一多之思想同時而並著不得謂由一生二生多也而康德與歷來之科學者僅知以數理為知識基礎不知以超數量現量事為知識之本源故雖有比量理智亦多迷謬也然此為常俗及學者間似現比量之通病不得責之一二人也比量理中能知十數十十以進乃為數理發達後之計算觀之中國印度以及西洋皆相一致然算學非徒計算數量也除數量之計算更有空量與時量之計算特數量之計算最為普遍明確若二加二必為四等數量中不必有空量方或空間形體之幾何學時量時間或古今過現未之時代表空量時量上則必有數量故有時統稱算學為數量近人亦多合稱算學為數學也二數量概説中國計數之十進位一十百千萬億兆京垓秭壤溝澗正載之十六位實際上億以上皆以萬數表之若十萬百萬千萬等而億兆等名已不常用之京垓等名更等於虛設矣不但中國如此即在今之人間亦如此也故西洋之計數雖或不止此十六位然實際應用上亦五六位耳佛陀學之各經論中則常用洛叉俱胝那庾多阿僧企耶等其數量計算位實超過人間常用之數位大小乘諸論及佛所行讚與法華經華嚴經等雖計算法及數目之次序多少似不一致但合觀之則十進之加法與倍進之乘法而已今以代表初期小乘學之上座部説出今錫蘭島巴利文三藏之上座部對法論所傳代表後期小乘學之俱舍論説一切有部之對法藏代表大乘學之華嚴經説列為三説次第明之三上座部之數量錫蘭島之佛學是阿輸迦王出家子姪摩哂陀所傳去屬於上座部之一派或上座部大衆部未分裂時稱上座之原始佛徒派故自稱其三藏之巴利文是佛説法所用之語承佛親傳而來之正統派今緬甸暹羅之所傳亦屬此派西洋人所知之佛學亦皆以此為本其傳承之歷史今尚不能清楚大抵千五百年前曾有一佛鳴尊者訓釋三藏等於薩婆多部在北方之訓釋三藏大毗婆沙論等遂為此派從古迄今楷模中國所傳譯多從北方及印度而來經律雖無大異而此派對法藏論之不同處則於近代西洋人之著述乃稍知之此派對於數量之説據其共傳信者從十進百之十進位共十六位然較中國之數量位已加二位以中國之十六位從一數起算故此或為印度古來相傳之計數方法非必為佛陀學之所獨有今表列其次序如左十個十等於一百十個百等於一千十個千等於一萬十個萬等於一洛叉億也十個洛叉等於一大洛叉用俱舍譯語兆也十個大洛叉等於一俱胝京也十個俱胝等於一額部曇垓也十個額部曇等於一鉢曇摩十個鉢曇摩等於一大阿庾多用俱舍譯語十個大阿庾多等於一那庾多同上十個那庾多等於一大鉢曇摩十個大鉢曇摩等於一鉢羅庾多用俱舍譯語十個鉢羅庾多等於一三慕達羅正也十個三慕達羅等於一末陀載也十個末陀等於一大矜羯羅用俱舍譯語十個大矜羯羅等於一頻