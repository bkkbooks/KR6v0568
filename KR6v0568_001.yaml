追溯俱胝以後即為學者之數可依之以漸達佛陀之數乃用倍倍相乘而進之法四五位後已難計算何況至於百二十六位耶後之二十數位諸菩薩地亦難自力比知唯藉佛説而知故華嚴唯此品佛陀自説餘皆菩薩説也菩薩從佛習此數學乃能算知無量由旬廣大沙聚悉知其內顆粒多少亦能算知東方所有一切世界種種差別次第安住南西北方四維上下亦復如是亦能算知十方所有一切世界廣狹大小及以名字其中所有一切劫名一切佛名一切法名一切衆生名一切業名一切菩薩名一切諦名皆悉了知此自在主童子告善財童子之一切工巧大神通智光明法門也然始於一數至不可説不可説轉數皆比量理非現量事而現量事既為一不能觸亦為不可説不可説轉所不能到也故曰若能不觸當今諱也勝前朝斷舌才六空量之計算空量計算即空間點線面積之計算則幾何學是也此種計算佛陀學中僅至常俗與學者之計算而止且較之近人所謂幾何學或尚不逮則因佛陀於此隨俗而説大乘學中但泛言若干佛剎微塵數而不詳言微塵之量如何積聚以成佛剎故言之者唯在於小乘學以大乘直觀有情器界等皆為幻象不用分析觀空而小乘則須用分析以觀空也故今亦唯取俱舍論為代表以言之點線面積之點假定為不可以長廣厚度量之圓微線可以量長而未能量廣面可以量長廣而未能量厚薄至積乃為具體形物須量以長短廣狹厚薄之三度凡度量一形物必須有此三度更加時量則須四五六度乃能得之若僅有長短廣狹之二度則如三直線相合而成一三角形式此種三角形式但為思想言説圖畫上之假設而非事實上具體之形物今取俱舍論説表演如下最單點曰極微假定極微為最單點但是圓量無長廣厚可量即風界種風即輕動之力等於以太七極微為一微量即火界種火即光熱之力等於電子已有長廣厚之可量七微量為一金微即地界種等於原子金即堅韌之質七金微為一水微即水界種等於分子水即溼粘之質由此質成生物質故七水微為一兔毛塵即生物之原形質也亦曰生元七兔毛塵為一羊毛塵無組織之細菌七羊毛塵為一牛毛塵有組織之細菌七牛毛塵為一隙遊塵隙光中肉眼可見之微塵七隙遊塵為一蟣肉眼可見細蟲之幼蟲七蟣為一虱肉眼可見之細蟲七虱為一䵃麥等於十分為一寸之一分若計重量此亦等於一分一虱等於一毫一蟣等於一釐一絲等於一隙遊塵一隙遊塵等於一牛毛塵而一指節以下等於一錢一兩一斤可知七䵃麥為一指節等於十寸為一尺之一寸而約計為英寸四分之三從極微到䵃麥皆七七數相乘而進有人計算䵃麥為一九七五二二六七四三個之極微然此不應計其個數以七極微為一微量之言乃指一微有一中心及六方分以言六方分即長廣厚也南北為長東西為廣上下為厚成唯識論所謂若有方分則可分析而非單體不可分析則無方分而超空量謂非復占空間之存在物而但為假想之境也可見其分析為七之分析方法然亦有計算一蘇迷盧為若干極微與若干斤兩者要為分析觀空之方便耳由一指節更推進之用以量長即為長短之量用以量廣即為廣狹之量用以量厚或深即為厚薄高低深淺之量或謂僅以量長度者非也其説如下三指節為一指二十四指為一肘四肘為一弓約六英尺或一海尺五百弓為俱盧舍約三千英尺或五百海尺即一里也或謂一踰繕那為里者非也八俱盧舍為一踰繕那踰繕那或譯由旬即一驛站也由旬為佛陀學常用之計量語踰繕那有小中大之三種此説小踰繕那一小踰繕那當中國之二十里或十六里一中踰繕那當中國之四十里或三十二里一大踰繕那當中國之八十里或六十四里計蘇迷盧等之大物則用大踰繕那算之計人間之行路或小或中或大無定故計算每不一踰繕那以上則大抵用若干踰繕那計之不另為專名矣然量物更須有四度以上乃能量得之者故當進説時量七時量概説時量久暫其粗顯者寄於日之出沒月之圓缺其細密者寄於人之心念生滅故從來之學者大抵以空量為物之特質以時量為心之特性分空量時量為沒交涉之二理乃分物心亦為沒交涉之二事近愛恩斯坦之相對論數理出乃知無有離時量之空量亦無離空量之時量時空一致乃有心物此空量中之時量不同彼空量中之時量彼時量中之空量不同此時量中之空量換言之則此心識中之形物不同彼心識中之形物彼形物中之心識不同此形物中之心識漸成時空心物皆為幻覺之幻象觀且能推知超比量理之現量事不得不謂科學者中之首出矣英國人湯姆生嘗論之曰愛恩斯坦學説之特點在置吾人於未有空間時間物質諸念以前以至於最原始之真體按即真現量事即吾人本之以構成如是之空間時間物質諸念者也今請揣其本而言之其説自易明矣試設一羌無經驗之靈性即離隨憶念隨計度等分別之現量忽焉置之於斯世之場野其最初所覺察者即此場野及其中凡物之全體幻覺之直覺吾人且將設此靈性為人類之靈性少頃始能辨物或錯覺或比量正知隨即辨認此場野之一部與其他部且將覺其本身與此場野為二物也心境始分又設此靈性具有軀體以為其致思之之中心於是始有彼此之分辨也物我始分使此靈性適見一花花中有蜂花之與蜂初為一渾然之個體現於彼處耳有間其蜂飛出而集此靈性之手則向之個體一部昔在彼而今在此矣又使彼蜂螫刺其手則其事之發生必在彼蜂與彼花渾然為一體之後此也彼也先也後也空間時間之觀念於是起矣且此手中之蜂原在空間者也使其悟此則物體占空間與時間之觀念由是生焉蓋空間有不同處時間有不同點其理一也如是推之物質之概念亦成矣以物質概念為空間時間與某事合成之概念未合成時則無物質足破以物質之原子為本生成萬物之謬以空間概念時間概念起於心境物我分辨後之某事若蜂螫手之事足破康德等以空間時間等為先天觀念之謬然愛恩斯坦於現量事猶是推設之比知尚未能觸證不分心境不辨物我之現量實相則於現實猶有一間之隔者也雖然以言比量中之時空名物則盡之矣可以説現變實事現事實性矣華嚴法界之六相十玄觀亦在是矣亦知識方法之傑哉時量之計算法中國説有一瞬一霎之小單位依肉眼及所見電光之最速度而言然幾瞬幾霎以為一須臾則無計算之法故僅泛説而已有計算者則為三十須臾為一時辰十二時辰為一晝夜約三十晝夜為一月三月為一時季四季以為一年三十年為一世如此而止今世所通行者六十忽為一秒六十秒為一分十五分為一刻四刻為一小時二十四小時為一日約三十日以為一月約三百六十五日分十二月為一年百年為一世紀此為人事上之時量生物學者更有較久之生物紀動經若干萬年地質學者更有較久之地層紀則動經若干千萬年天體學者更有較久之天體紀則動經若干萬萬年故在時量之計算限昔中國之計算基督教等亦然於佛陀學之大時量以其程度相差太遠大都為之不能想像而近代科學者之時量計算則漸能幾及之也茲亦用俱舍論之説以略明之八小時量之計算佛陀學中大抵以剎那為計算時量之最暫小單位有説一念即心之一動也頃有九十剎那計一分鐘為四千五百個剎那大毗婆沙論則説一晝夜有六十四萬萬六千六百零六萬六千六百八十個剎那也然有諸經論則説除佛陀不能知剎那之真量蓋以能知之心念量粗細有殊則所知之時量亦萬別千差也今以俱舍論説表列如下剎那比忽較暫百二十剎那為一怛剎那比秒較久六十怛剎那為一臘縛比分較久三十臘縛為一牟呼栗多合今通用時計表之四十八分即當一刻五呼呼栗多為一迦攞迦攞譯實時即當時合中國古時辰二時今通用時計之四時六迦攞為一晝夜依此計算則一晝夜乃為三千二百八十二萬個之剎那較婆沙之計算粗顯多也故此可通常俗及學者間之用更細微之一動殆非人間心量之所能覺察思辨矣故小時量暫應以此所説剎那為準九中時量之計算佛陀學中常説晝夜六時即指六迦攞言晝三時曰上日中日下日夜三時曰初夜中夜後夜合晝三時夜三時為晝夜六時此大抵為印度佛陀學者之所通用然亦有分為晝四時夜四時合晝夜為八時者亦有以晝夜六時為晝六時夜六時而一晝夜同中國之十二時者十二迦攞為一晝夜則牟呼栗多以至剎那皆加一倍矣然此等但泛言而非定説故仍當以俱舍為標準耳由之進推則為月季年等三十晝夜為一月每月分為兩個半月曰黑半月乃是中國之十六日至三十日用月光之初虧以至全晦為紀曰白半月乃是中國之初一日至十五日用月光之漸盈以至圓朗為紀此律藏中常用之黑月白月或半月半月是也由此觀之印度與中國雖同用月歷然有不相同者則中國之初一是印度之十六中國之十五是印度之三十也如此黑月白月兩半分合成者謂之一月四月為一季玄奘所稱印度通行之分季法即每年分為寒季雨季熱季是此分法與餘處不同大抵出於環境關係為印度適於實際生活之分法或分二行則依肉眼所觀日在天空運行方向而分謂第一行中日逐漸北行第二行中日逐漸南行也此大抵出於印度通俗之傳説或分春夏秋冬四季則全與中國同亦為佛陀學理論上之所注重實為一較妥當較普遍之分法或分五季最不齊整謂四個月為冬季四個月為春季一個月為雨季一晝夜為末季又三個月為夏季此似有西洋日曆用一年日數分月之方法者故以一日另為一季其一月或不限三十日也而毗奈耶律則稱此分法為當或分六季每季兩個月整乃從三時各分為二而説故其名稱亦為漸熱時盛熱時雨時茂時漸寒時盛寒時之六時也或二季以至六季為一年然以十二月為一年則同十二月為一年十二度月光之盈虧以為一年亦必有閏月法否則數年之後季候即不齊等勢難通用然其閏月之法猶不可知而每年之十二月則各有專名一制怛羅月二呿舍怯月三逝瑟吒月四額沙茶月五室羅伐拏月六婆達羅鉢陀月七額溫縛叟闍月八迦刺底迦月九末伽始羅月十報沙月十一磨伽月十二頗勒寠拏月合如是十二月則為一年一百年為一世此觀於説釋迦時人壽為百歲及説初百年中以至三百年中四百年中等可知矣五百年為一變此觀於説佛法住世初五百年如何以至後五百年如何可知之矣一千年為一化此觀於説正法住世千年像法住世千年可知一萬二千年為一周此觀於佛法住世正像末共一萬二千年可知之然歷來佛陀學者詳於心念生滅相續史及物界成壞相續史故説小剎那及大劫簸之時量而對於人文相續史則視之較漠然故年以上之世變等言之不甚詳確致今日以詳知其歷史為難也在公平觀之現實主義中於此一點不能不推中國及西洋為較勝十大時量之計算大時量即佛陀學常用之劫字具云劫簸意譯大時而此劫簸又大抵分為小中大劫之三種小劫以此地球人類壽量增減計算中劫以此地球人類始有終計算住劫大劫以一恆星系之一度成住壞空計算各大劫各有其名號今賢劫其大致相同之劫量如下一人壽一減一增為一小劫大地初成屬於成劫尚非住劫居者為天神等化生自然非屬人類不入此增減之計算逮入住劫乃人生類初生者壽量八萬四千歲身材長大約十餘丈後百年生者即減壽一歲身亦漸為短小如此百年百年遞減一歲一歲至人壽六萬歲以前則曰聖世天人交通人皆聖善從此百年百年遞減一歲一歲至於人壽四萬歲時則曰賢世福利漸減猶為賢善之世從此百年百年遞減一歲一歲至於人壽二萬歲時則曰盛世猶有賢世善利之半從此百年百年遞減一歲一歲以至人壽百歲極於十歲則為衰世諸善益衰諸惡增長此為一減減至十歲身材僅尺餘長類一猿猴地曠人稀更無惡事可為惡機既消善心來復由此仍以百年遞增一歲遞增至八萬四千歲由衰世而聖世是為一增如此一減一增所歷年數曰一小劫説此地球人壽已經八度減增今在第九度之減中釋迦出世已為衰世之人壽僅有百歲時今當更減去二三十年矣亦有於增壽作倍增計者則十餘萬年即可增足矣二二十小劫為一中劫人壽一減一增所歷年數之小劫二十度為一住劫即為中劫之量住劫之前大地無人住劫之後大地無人言住者存在也此地球人類存在之時量故曰住劫然勿謂等於住劫劫量之中劫必須有人壽減增為計算之也人壽減增二十度之時量但為計算等於中劫劫量之方法耳然藉此方法計算則知住劫之劫量亦知等於住劫劫量之成劫等劫量三四中劫為一大劫等於住劫劫量者前有成劫而後有壞劫空劫成劫為此世界之生長期住劫為此世界之壯盛期壞劫為此世界之老死期空劫為此世界之滅無期由空劫而再轉入於成劫如是成住壞空相續而無已時一度成住壞空為一大劫然一世界或同系統之千世界百萬世界億萬世界成住壞空非全宇宙中諸世界皆同時成住壞空也或成或壞或住或空故太空中常有無數之世界成而住亦常有無數之世界壞而空也然此大劫依一個火壞劫而説乃太陽分崩之一度壞滅每一大劫有四中劫八十小劫每一中劫二十小劫茲為一圖以助小中大三劫之記憶大劫中劫小劫四七火壞劫即大劫後有一水劫地為所壞水火風為能壞火壞經七度後其第八度乃為水壞火壞壞盡初禪而止不及二禪水壞乃能壞盡二禪五七水壞劫後有一風壞劫經七度之水壞其第八度乃為風壞水壞壞盡二禪而止不及三禪風壞壞盡三禪但四禪天為不壞耳每一風劫有七水劫有五十六火劫每一水劫有七火劫其式如下風劫水劫火劫然佛陀學中常用之劫字皆指每一度火壞之大劫而言水劫風劫既不常用而中小劫亦必加稱小劫中劫無單稱曰劫者故劫字乃專用為大劫之稱呼而亦以大劫為大時量之最大單位以若干劫為計算也十一相對之時量然時量中小時量之最小剎那位既暫以此一人間心念生滅量而假定在心念生滅量更微密或更粗疏者不定如此而中時量暫以日球對地球一度隱現之一日以為計算單位亦屬假定他星球上人與太陽關係有殊此地球上亦有半年有太陽半年無太陽者或幾常年有太陽者故四王天以人間五十年為一晝夜忉利天以人間百年為一晝夜則人間之一日在彼不及一秒況彼心念生滅更為微密人間一秒彼又不啻一時蚍蜉不知晝夜而大樁以八千歲為春秋相對觀之如此延促相差可知今此時量皆為人間幻覺中之幻相而彼等當別有不同之時量也然彼等猶規定在大時量中者更若華嚴經説此娑婆世界釋迦牟尼佛剎一劫即一大劫於極樂世界阿彌陀佛剎為一日夜代表初地菩薩時量極樂世界一劫於袈裟幢世界金剛堅佛剎為一日夜代表二地菩薩時量袈裟幢世界一劫於不退轉音聲輪世界善勝光明蓮花開敷佛剎為一日夜代表三地菩薩時量不退轉音聲輪世界一劫於離垢世界法幢佛剎為一日夜代表四地菩薩時量離垢世界一劫於善燈世界獅子佛剎為一日夜代表五地菩薩時量善燈世界一劫於妙光明世界光明幢佛剎為一日夜代表六地菩薩時量妙光明世界一劫於難超過世界法光明蓮花開敷佛剎為一日夜代表七地菩薩時量難超過世界一劫於莊嚴慧世界一切神通光明佛剎為一日夜代表八地菩薩時量莊嚴慧世界一劫於鏡光明世界月智佛剎為一日夜代表九地菩薩時量從鏡光明世界如是乃至無數佛剎之最後一世界一劫於勝蓮花世界賢勝佛剎為一日夜普賢菩薩及諸同行菩薩充滿其中代表十地菩薩時量自大觀之此一大劫在彼殆不及一剎那自小觀之此一剎那在彼殆不啻一大劫相對觀之如此延促相差可知今此時量皆為此世界有情類幻覺中之幻相而彼等當各有不同之時量也十二相對之空量前曾假定極微為不可以長廣厚量之微圓點極微以上之微量等則為可以長廣厚量而有六方分者又假定以十萬萬恆星系恆星系即太陽系億萬恆星系即大千界為最大量然亦暫以人間之比量所知境為此言耳相對觀之人身中之細胞有情則以人身為彼地球而地球為彼不能想像之宇宙然色究竟天之有情身高十八萬踰繕那大於地球者若干倍則人於彼又細胞之不若況彼觀察力強細胞可大於人而細胞中又有無數之細胞依以生活不啻人之依地球住如此小大相差長短廣狹厚薄以及南北東西上下之量固相對無定也則奈端等以地球中心吸力所立之地文算學以日球中心吸力所立之天文算學雖可暫適人間實用究為人間幻覺中之幻象然此等猶規定於大空量中者進如華嚴經説諸佛子此不可説佛剎微塵數香水海中有不可説佛剎微塵數佛剎微塵數即一大千界之微塵數世界種安住一一世界種復有不可説佛剎微塵數世界一世界假定為億萬之恆星系諸佛子彼諸世界種於世界海中各各依住各各形狀各各體性各各方所各各趣入各各莊嚴各各分齊各各行列各各無差別各各力加持諸佛子此世界種或有依大蓮花海住或有依無邊色寶華海住或有依一切真珠藏瓔珞海住或有依香水海住或有依一切華海住或有依摩尼寶網海住或有依漩流光海住漩流光海似近人所説之以太或有依菩薩寶莊嚴冠海住或有依種種衆生身海住或有依一切佛音聲摩尼王海住如是等若廣説者有世界海微塵數諸佛子彼一切世界種或有作須彌山形或作江河形或作漩流形或作回轉形此太陽系似之或作輪輞形或作壇墠形或作樹林形或作樓閣形或作山幢形或作普方形或作胎藏形或作蓮花形或作佉勒迦形或作衆生身形或作雲形或作諸佛相好形或作圓滿光明形或作種種珠網形或作一切門闥形或作諸莊嚴具形如是等若廣説者有世界海微塵數諸佛子彼一切世界種或有以十方摩尼為體或有以衆色焰為體此太陽系似之或有以諸光明為體或有以寶香焰為體或有以一切寶莊嚴多羅華為體或有以菩薩影像為體或有以諸佛光明為體或有以佛色相為體或有以一寶光為體或有以衆寶光為體或有以一切衆生福德海音聲為體或有以一切衆生諸業海音聲為體或有以一切佛境界清淨音聲為體或有以一切菩薩大願海音聲為體或有以一切佛方便音聲為體或有以一切剎莊嚴具成壞音聲為體或有以無邊佛音聲為體或有以一切佛變化音聲為體如是等若廣説者有世界海微塵數則自大而觀之一太陽系不啻一極微矣然曰一微塵中有無數剎一剎即億萬太陽系無數剎中有無數佛一一佛身各毛孔中有無數剎剎中佛身佛身毛孔毛孔中剎重重無盡則自小而觀之一極微之大於太陽系又不知若干倍矣相對之空間量相差如此之遠則知今此空量皆為此世界有情類幻覺中之幻相而彼等當各有不同之空量也十三相對絶對之算學前於數量説常俗與學者及現實主義者三種已明其相對之差矣然此要皆各有情類比量共相中之差別事義未足以通現量中自相事及現比量中之普遍義也為此當進明相對絶對之算學以通勝義即諸法無我及真如等勝義及現量事茲引華嚴教觀以略明之彼於所觀法分教義與理事等十對能觀法分三門十玄今取所觀法中之第二理事對以能觀法第三門中之十玄説明之彼所用之理事二名與今現實主義不同故先應解釋之彼以現比量中之普通義即無我真如等為理而以現比量中之自共差別因果相事為事理指一分勝義事包一切事及差別義等明彼理事二名之界乃可言之一理如事法門謂全理為事理亦如事而無盡故二事如真理門謂事不異理事亦隨理而圓遍故三事含理事門不唯理含事理亦且事含理事故四通局無礙門不唯全遍十方而亦不動本位故五廣狹無礙門不唯廣容剎海而亦不壞一微故六遍容無礙門以一望多則一法遍一切時還復容彼一切蓋由普遍即是廣容故七攝入無礙門以多望一則一切攝一法時還復入彼一法蓋由攝他即是入他故八交涉無礙門一多俱為能入攝故一攝一入一一攝一切入一切一切攝一入一一切攝一切入一切一能攝入與多攝入交涉無礙九相在無礙門多一俱為所攝故攝一入一攝一切入一切攝一入一切攝一切入一多所攝入在於一所攝入互相無礙十普融無礙門一多遍容能所攝入普皆圓融無盡一能攝入融於多所攝入普無障礙依此十觀比量事義及現量事之別別不同者一一等於現比量中之普遍勝義故現量勝義即離言真如比量勝義及依言真如別別事義一一各含一切事義大長廣厚高深重含小短狹薄低淺輕中於大不迫而小不壞故即空量而超空量久大劫含暫剎那中於久不促而暫不延故即時量而超時量多含一中於多不失而一不雜故即數量而超數量何以如此現量證知故比量決知故緣起無性故法性融通故事如幻夢故變化無限故總之則現實如此故第三節聲明略説一聲明概説聲明即語言文字學文字根於語言語言本乎聲韻故以明語言文字之學曰聲明語言文字為有情類情意想念互相交通之具猶身器交通之道路及舟車也未成語言之前固嘗先有聲勢容勢手勢面容等等以互表情想一群之同類者習熟聲音曲屈之趣世代相傳而語言起未成文字之前固嘗先有結繩圖象等以相持意念一群之同類者習熟形聲契合之趣單文及字母即為形之符號或聲之符號世代相傳而文字起演而益進語文蔚興亦猶椎輪大輅踵為汽車語言如點功在暫親表示文字如線功在遞久傳持語言如身運足行路文字如身乘舟致遠非語言文字則自心衆心無以相涉歷而通恕恕者推衆心如自心比自心如衆心即為推比之所由起欲由推比而求決知語言文字之為必要工具亦不亞於數學故曰有名為物之母也然語言文字不限於人類佛本行經説六十四種書書即語文之學梵天所傳書佉盧瑟吒書富沙迦羅書阿迦羅書瞢伽羅書上五皆印度古語文學邪寐尼書希臘拉丁系語文學盎瞿梨書邪那尼伽書娑伽羅書波羅尼書波流沙書父與書毗多荼書陀毗荼國書達羅毗荼系語文學脂羅低書楔形文字度其差那婆多書優波伽書僧佉書阿婆勿陀書阿盧摩書毗寐奢羅書阿陀羅多書烏拉阿爾系語文學珂沙書失勒或勒特系文語脂那國書中國文語摩那書末荼叉羅書毗多悉底書富數波書提婆書天語那伽書龍語夜叉書鬼神語乾闥婆書鬼神語阿修羅書神語迦樓羅書妙翅鳥語緊那羅書疑人語摩睺羅伽書神蛇語彌伽遮迦書諸獸語迦迦婁多書諸鳥語浮摩地婆書地居天語安多梨叉提婆書空居天語鬱多羅拘盧書他星球人語逋婁婆毗提訶書他星球人語西瞿耶尼書他星球人語烏差婆書膩差波書娑伽羅書跋闍羅書梨伽波羅低黎伽書毗棄多書阿浮多書奢婆多羅跋多書伽那那跋多書優差波跋多書尼差婆跋多書波陀梨佉書毗拘多羅波陀那地書邪婆陀書多羅書末荼婆哂尼書梨沙耶婆多波慘比多書仙語陀羅尼卑叉梨書地質史伽伽那卑麗叉尼書天體史薩蒲沙地尼山陀書生物史沙羅僧伽阿尼書諸書總覽薩婆婁多書一切種音其在提婆書以下之三十六種大抵非此地球人類之語言文字也在此地球人類各種文字據傳略分三式一右行式梵文及西洋文屬之二左行式印度之佉盧書或他州族有之三下行式中國文字屬之是中所傳此人間之語文雖莫詳其分系對觀今世通行之語文學亦可髣佛見之茲録韋爾斯所著人類語言表以為參考其所列者皆屬各民族之單純語系混合語言未列屬焉此中各族之語言文字學今不專論而語言文字之統一實為今而后人類之需要察地球之大勢華文系梵文系及英文系三為最廣流行語系取此為經參以各族文語為緯織成一地球之語錦為今世語言文字學者之鴻業英文由希臘拉丁文孳乳而生華文之起頗早始於象形繼以指事諧聲會意版圖擴大多族同化集各方語文互相轉注而殺其有餘藉遞代語文因應假借而補其不足所謂六書即六種依語言而製文字之方法所製成之文字也凡各文字皆有聲韻形體意義之三方面説文解字爾雅韻府等為研究之專門書近世戴段錢王俞章之考證學集其大成茲難具述惟略言佛陀學根柢之梵文耳二梵文與聲明印度古代文字通名梵書巴利文等通俗梵文亦梵文之支流俗傳是劫初梵王造謂有百萬頌釋今可考之聲明古籍當推六吠陀分中論字源梵云尼祿多等書作者為耶斯迦其書中雖傳有古作家迦多婆之名即舊傳之迦單設羅仙略古聲明為萬二千頌者今亦無考後梵語於吠陀語外別成一種雅語二千四百年前大語學者波尼儞出整理雅語遂為聲明別闢一新時期如定字母為四十七別為字母各聲虛實諸詞囀聲各異十羅三世秩序井然凡此大端皆為後來語學者之所本今略舉其著作如次第一蘇呾囉凡八篇三十二章三千九百七十六則為聲明論之根本典唐人傳為八千頌之根本經者是也其籍現存第二伽那婆他語彙之類第三馱都婆他為三荒章之一有八百頌大聲字義之義舊譯八界論者是也第四溫那地舊傳三荒章之一有一千頌論字緣後之三種為前一種補充遺義之作波氏以後作者大多從事注釋其略如次二千二百年前迦多耶也那作本經之釋文略為千二百四十五則二千一百年前鉢填闍梨作大婆沙約為千一百十三則此書現存義淨傳為朱彌有二十四千頌者是也自後作者中絶凡數百年一千六百年前旃陀羅作二二四章記論別成一派一千四百年前闍耶佚底與縛摩那共作迦尸迦頌義淨傳為蘇呾囉中最妙有十八千頌者是也稍後伐緻訶黎作伐緻訶黎論二十五千頌釋大婆沙薄迦論七百頌敘聖教量及比量蓽拏頌三千頌時護法論師作蓽拏頌釋十四千頌又作雜寶聲明論二萬五千頌為梵文雅語最究竟之作自後印度別行俗語法則精嚴稍遜前矣亦印度文化衰落之徵也此為梵文學之略史佛陀學將古代學術總分五科謂之五明梵語播遮吠陀猶云五種之科學也學者習之自記論始記論梵云毗阿羯刺拏即舊傳毗伽羅論記論乃分別聲韻訓釋文例者近於今所謂文典等為研習他種學術之基礎佛學中始明此學曰聲明次因明則論理學也次醫明則醫藥學也次工巧明則算學及人間實際應用諸學皆是若農工政法等觀華嚴經善財所聞自在主説可知西域記謂印度開蒙誘進先遵循十二章七歲之後漸授五明大論一曰聲明云云則聲明者猶近代考證學者所云之小學是也佛陀學傳華後翻譯至於唐代精嚴遂臻其極章句之間往往存梵文之形式不習聲明即時苦其詰屈難讀兼以辨別主賓應知囀聲之例審定名義必從離合之方毫釐之差不厭研核惜聲明之學唐賢傳譯未詳備後之學者無所依據今則轉藉歐譯稍便尋究然猶不易言也三何謂名句文身詮表單事單義之單名曰名若中國字典辭典所列之各字各辭二個名字以上聚寫一處則曰名身梵云那摩迦耶或多名身綴二名以上詮表彼事義與此事義關係者之一辭曰句例云人死或人皆有死等二個名辭以上聚寫一處則曰句身梵云鉢陀迦耶或多句身不詮事義而但為附麗聲音曲屈之符號者曰文亦曰字母例等佛陀學中或賦與玄密之意義非其本也二個字母以上聚寫一處則曰文身或多文身梵云便繕那迦耶便繕那原義為鹽等故舊譯味中國文字有名而無字母此與西洋文及梵文異者而梵文之有字母則與西洋文同也身者聚也意顯聚集多名説多名物聚集多句説多句意聚集多文表多聲韻故謂之身然文身仍為文而非名句名身亦仍為名而非文句句身亦仍為句而非名文其界不相混也推名句之所依乃及文身故置後説若循學習之序應曰文名句身先學字母乃及字母拼成之名名綴成之句故亦有以文為成篇之文章者非其本義瑜伽説聲明處有六種施設建立相一曰法謂名身句身文身及不鄙陋輕易雄朗相應義善之五德相應聲以聲為體文名句是聲上音韻屈曲之用體用兼彰則為名句文聲四法二曰義謂十種義根大種業尋求非法法興盛衰損受用守護又六種義自性因果作用差別轉三曰補特伽羅數取趣有情或人也謂建立男女非男非女聲相差別或復初中上士聲相差別四曰時謂三時聲相差別過去過去殊勝未來未來殊勝現在現在殊勝五曰數謂三數聲相一數二數多數六曰處所根栽處所謂相續名號總略彼益宣説五皆諸聲明本籍中品名故謂為處所根栽謂界頌等及論字之為餘義所根者是六相者概括一切能詮所詮差盡聲明所明要不外是然第二義相屬一切所詮遍餘明處聲明正屬能詮故當就第一法相第二補特伽羅相等五相以論之此言名句文身正是第一法相亦是聲明之總相也下之所論不出於此四文及文身辨文身音韻及拼法者及悉曇章西域記謂童蒙所習在五明論之外寄歸傳則視為聲明五論之一真言宗傳中國之後以須意觀梵字口誦梵音之故辨字音之悉曇成為專學古今著述頗有能詳盡者悉曇譯云成就乃寫字母時用為篇首之標章表學之有所成就之吉祥意者後人因寫字母先韻後聲韻母前即標悉曇遂誤悉曇為字母寖假而用為字母之總稱故諸學者常舉悉曇字母梵云悉曇摩呾理迦為言而於論字母連綴聲音轉變之書亦名為悉曇章也舊傳字母之數多寡不一瑜伽則定字身為四十九倫記引奘師云傳有三説一説𧙃阿一伊塢烏紇呂紇閭呂𦟐污隩為十四韻別加暗惡為助句辭超聲有八毗聲有二十五加標首之悉曇為四十九一説悉曇但是總標不入字數別加濫時鮔意餘同一説韻有十六暗惡亦入韻數餘同涅槃經文字品説三十五字為聲母十四字為韻母故共四十九字然按華譯涅槃有五十字中一羅字係疊聲之濫入故唯四十九字為定字母分為韻梵云摩多聲梵云毗衍闍南之二其間部別煩復波尼儞之所分別者其目如次單韻𧙃等韻復韻咽等半韻也等一切字母喉聲迦等顎聲者等聲舌聲吒等捨沙婆呵齒聲䫂等唇聲跛等或別聲為七類一迦等五二者等五三吒等五四䫂等五五跛等五六也等四七捨等四依此分類表列古今所譯字音如左聲韻分類奘師傳者涅槃經者近人譯者𧙃短阿阿單阿韻阿長阿阿一短伊伊韻伊伊長伊伊塢短憂烏六烏烏長憂烏咽咽厄復厄藹黳厄韻污烏鄂四鄂隩炮鄂紇魯唎別呂伊紇流唎韻呂盧利四閭伊𦟐樓利聲隨韻暗菴昂止聲惡疴阿斯喉迦迦嘎毗佉呿喀聲伽伽噶哈五鍵伽重音噶缺俄迎阿二合鄂者遮匝綽車擦聲闍闍雜哈五缺闍重音雜缺若尼鴉二合舌吒吒查搋他叉聲茶茶楂擇茶重音楂五拏拏那哈齒多頁多答他他塔聲柁陀達哈五達陀重音達娜那納唇跛波巴頗頗葩聲婆婆拔哈聲五薄婆重音拔磨摩嘛也耶鴉超前洛囉喇四砢羅拉亦縛和斡曰捨賒沙半沙沙卡聲韻娑娑薩呵呵哈若字形屈曲之寫法古今變遷不一近人多用提婆那伽利書與今所傳不無殊異此外綴音生字之法則等詳在悉曇字記五名及名身瑜伽及顯揚等均以聲明六相為名身六依處蓋聲明雖包括名句文身而名實為主要謂之名明亦無不可廓充之若中國且合因明稱曰名學可知名之關係大也然在華文於此乃無專著比迹尋之略有可述一者名之構造所謂字界字緣二者靜詞囀變所謂蘇漫多聲三者動詞轉變所謂底彥多聲六字界字緣梵文名身多有語根及最簡單之名而為餘名所從演繹謂之字界字之因也於語根之首尾附加單名謂之字緣字緣附字因後字因原義或變或否乃成語幹謂之字體成唯識論有云毗助末底是疑義故末底般若義無異故此説主張疑是慧之一種末底般若均譯為慧以毗字緣加助末底字界成毗末底則為疑義主張字界原義不變則疑仍為慧之一種若主張字界原義已隨字緣而轉變則疑非慧辨此糾紛在明字界字緣毗是字緣末底是字界也取譬明之字界字緣皆若華文單字例人與言字界字緣合成字體則若華文二字合成一辭亦同會意之字例人言之為信人言固為言之一種可仍是言然合為信則別指信德而非指言矣此為二名構成一名之式七蘇漫多聲於字體上更於其末聲韻變化以表此名與他名之中介等關係及名在句中之位次者有八囀聲一體聲梵云你利提勢表能作者或一事一物之當體居句中之主位例云農人二業聲梵云塢波提舍泥表所作即動作所止居句中之賓位例云務農前二汛説之詞三具聲梵云羯嘻唎迦囉泥此表動作之所由藉居句中之附加主位例云由耕種力此明自因四為聲梵云三鉢囉陀你雞此表動作之何所為居句中之第二賓位例云為資生故此明目的五從聲梵云裒波陀泥此表動作之所從來例云從師學來此明他緣六屬聲梵云沙弭婆者你表動作者繫屬所在例云務農中國此明統屬七依聲梵云珊你陀那囉梯此表動作之所依對例云依農具等或於田中此明助緣八呼聲梵云阿曼怛羅泥此表所呼召者獨舉其名與餘無涉故在句中為獨立格例呼某人今更問答明之例如觀一農作問曰作者誰答曰農人工作何事答曰務農用何務農答曰由耕種力為何務農答曰為資生活何能務農答曰從師學來務農何屬答曰務農中國將何務農答曰依農具等及於田地爾何姓名答曰某某集成一文即農人務農由耕種力為資生活依犁田等從師傳習務農中國名為某某也於此文中各名關係及其位次在梵文皆以各名之尾聲變化示其區別察其尾聲區別知示何種關係居何位次謂之囀聲參閲瑜伽論及雜集論等唐譯經論應用其八囀聲者甚多茲不繁引梵語中具囀聲變化之名皆有數目其別凡三一數為一言梵云翳迦囀遮拏二數為二言梵云陀毗囀遮拏三數上為多言梵云波呼囀遮拏此三亦以字尾囀聲為別但歷來譯文殊少明白標出者但亦有時以數目差別不能不辨者例成唯識論解二各二云上一二字顯兩種二第一種悔眠二第二種尋伺二蓋特嚩炎是一言之二特嚩曳是二言之二特嚩是多言之二二各二句上一二字是一言二則但二法是多言二則可多法今此上一二字是二言二表有四法故統兩種二法前八囀聲各以此一言二言多言之三囀乘之則成二十四種囀聲聲尾示單數多數之區別英文亦有但華文則無耳名代形容等囀聲名又有男聲梵云蓬稜伽女聲梵云尸吒唎稜伽中聲梵云紇梨波稜伽譯不分男女聲或作非男非女聲之別歐文亦有此種區別中國近亦仿之如以他字呼男他字呼女牠字汛呼者是此等雖以物之性質為別然梵語於尾聲變化不厭其繁男女聲韻長短差異故其字體亦變為他種聲而供應用大抵男聲尾為短韻女聲之尾則為長韻每四句頌短韻長韻相間而用猶中國之律詩別平仄然以聲韻為區別故諸囀聲皆可有此三別唯識樞要釋成唯識謂梵音毗若底識摩呾刺多唯悉提成於女聲內呼之若用男聲則為毗若那識摩呾刺唯悉達成即其例也以茲三囀乘前二十四囀則有七十二囀此前三共七十二種囀聲皆明名代形容諸靜詞尾聲變化者總曰蘇漫多聲多以蘇聲居後而成其囀聲故且此在泛常文語中亦多用之故基師云見於泛文八底彥多聲梵文除介詞助動詞連詞等名無聲韻變化之應用外其餘靜詞動詞等名字體原名或字界字緣合成名雖不變動然每視所應表白而變其尾聲前已明諸靜詞之囀聲矣今更進明動詞囀聲梵語動詞中時之區別甚繁復波尼儞嘗舉語尾羅聲之種種表時變化曰十羅聲名義如次泛説羅吒泛説現作一現在時願望稜説現願作命令路吒命他現作正過去藍泛説已作二過去時已過去梨吒説久已作泛説魯頞泛説非現時作不定過去希求悉囉稜表已願作泛説魯吒泛説當作單純未來三未來時假設過去羅林假説已作實是當來復述未來羅唎吒藉餘語以顯其當作此種分別亦近希臘語系諸國文語華譯於過去用已訖等未來用當等命令用應等願望用願欲等雖甚瞭然攝略未盡此表時別異之動詞亦用聲尾囀音為表即二九韻或十八囀聲也先分為自而言為他而言二種每種有泛説説自説他之三種則成六囀每種又有一言二言三言之別乃成十八囀聲其式如次泛説一言二言多言為自言説自一言二言多言説他一言二言多言泛説一言二言多言為他言説自一言二言多言説他一言二言多言此十八囀多以底聲居後而成其囀聲者故曰底彥多聲泛常文語不甚嚴別惟學者間取為準繩故基師曰則以莊嚴文句非謂泛文無動詞變化也底彥多聲中為他言九韻梵云般羅颯迷即動詞所表動作及於他身他物者其為自言九韻梵云阿答末泥即動詞所表之動作仍返於自身而止者為他之言泛用較多為自之言多用令文巧妙文語俗雅朴華雖不離絶然亦往往因之而判又瑜伽論初中上士初士梵云烏他摩補魯殺此即泛説中士梵云摩馱摩補魯殺即此説他上士梵云鉢羅檀補魯殺即此説自初以泛説中以説他後乃説自不同歐西以自名第一人以他名第二人以泛名第三人先泛後自為順序之知識先私後公乃顛倒之思想此亦梵歐之一殊也初言未辨他自類如小兒次言辨他忘自則類庸人後言察餘明自乃類達者故基師以之為喻也九名句間之六合釋構名成句有時還用構成之句用之若名此名句綴合之成語泛文之應用者殊廣遠為歐羅巴系等文語所不及而各有其構成之法則因此含義周詳可省無數繁文復韻然譯為華文者未能著其條例有之則其一部分之六合釋梵云殺三摩娑耳參考法苑義林章等此六合釋亦曰六離合釋蓋欲尋一合成語句之義當先離析以為二名或三四名然後察其以何方式合成定其訓釋之義茲先列其六種方式乃援例證成之一依士釋又曰依主句中前分為後分依對之有領屬關係者二持業釋又曰同依句中前分泛用諸名以敘述後分者三帶數釋亦曰雙物句中前分專用數名以敘述後分者四不變釋亦曰鄰近句中前分為助動詞等餘句亦用如助動詞者前四皆為句中以前分限定後分之義者五有財釋亦云多榖全句如一形容詞者此多由前類合成句轉成亦為第二次合成句六相違釋亦云對偶句中兩名立於平等並立之位前分後分無關屬者一依士釋多屬第六轉聲然亦不拘限之例成唯識論述記云由抉擇所得滅名為擇滅由第三囀上依士釋梵云鉢囉底僧佉耶此云決擇梵云尼路馱此云滅由決擇而得滅合成擇滅之語末用第三囀聲故以依士釋之二持業釋句中前後分名雖各詮其一義然同目於一事故亦謂之同依前分或為名詞或為形容詞助動詞例成唯識論云七持業釋如藏識名識即意故六依主釋如眼識等識異意故意者梵云末那思量為義識者梵云毗若那喃分別為義曰意曰識同目第七之用故曰七持業識若第六雖同名意識依第七意而名意識故曰六依主釋三帶數釋等於持業但前分為數詞而已例云六識七識四不變釋不變者謂其句語無尾聲囀變全語用如助動詞也例云念住實住定慧若云於定慧住屬依主釋然不云定慧住曰念住者念易知故近定慧故具足應云近於念之定慧中住猶云近於長安之終南住欲人易知但曰近長安住或近念住念顯定慧所近之處用顯住於定慧故為助動詞而尾聲不囀同不變釋或引伸之曰鄰近釋五有財釋多用他語轉以形容別一名者例云覺者覺是菩提者指佛陀用有菩提形容佛陀故曰覺者或但以覺釋佛則並所形容之一名省去所謂以他為自全受他稱者也故前分末之男女一多等囀聲必與所形容者全相一致義林章云論以唯識為所成名成唯識論亦有財釋用成唯識三字為論字之形容指之曰成唯識論或能有成立唯識理之用者故有財釋分析其式如下名名形一名一毗若底摩呾刺多容悉地言奢薩呾羅言體體詞詞詞聲詞聲識唯或量成論持業依主有財以識即量故持業識或識之唯亦依主釋唯識之成故依主釋以能成唯識為論形容詞故有財釋若云成立唯識之論亦依主釋蓋一語句析之可為多釋有財釋於成唯識論之句內特為多釋中之一釋故曰亦有財釋六相違釋並列二名以至多名不相關屬成一語者例云立破真似謂能立與能破及真能立真能破與似能立似能破也雖或不用與及等連介詞嵌入解釋之時則同有與及等連介詞者以六合釋本通用於名與句間者也立破真似亦謂之句猶能立與能破之成為一句也句及句身等構成例近刊有阿彌陀經楞伽經等梵文原典當以梵文文典考其成例茲不詳述十聲明之用與體聲明包舉語言文字文字以語為根語言之用在名句味味即字母亦即文身乃聲音之符號名句味乃聲上屈曲音韻聲為事體名句味乃聲之分位差別聲實名句文假故諸文語以聲為體或曰語言雖用耳聞文字乃由眼見點畫等為色之曲屈形狀色為事體點畫等乃色之分位差別色實點畫等假故未有文字前所聞語言以聲為體既有文字則聞語言音樂或見文字圖畫皆能解其所詮表義故以聲色為體或曰就能詮表於義之事以明其體則云聲色為體亦但循此人間之常俗耳聾啞者之解義則唯以色為體盲者多以聲觸為體在旁生等多以聲香味觸為體他有情界或光色等或香味等或夢法等皆得為體故以色聲香味觸法為體或曰文言有二一者顯義文言色聲法等為體二者顯境文言諸識心等為體且色聲等即為識心之所顯境境含現量比量一切所知事義將所顯為能顯故唯以識為體或曰窮究其本諸識分別及所分別皆以無分別之現量實相為依故皆應以現實真如為體或曰體用重重可別論之真如為體識等為用諸識為體色等為用色聲等事為體名等假位為用不至真如顯體不盡不至假名明用不周以用顯體依體明用體用重重乃能周盡圓滿融徹如前相對絶對之算學觀乃為現實主義之聲明也語言文字如此借觀餘法亦無不然要之皆為現變實事皆為現事實性皆為現性實覺皆為現覺實變能知現實所用工具還即現實而已第四節立破真似一立破真似概説立破真似都指比量而言有為自求知之比量如前現比真似節中所説有為他令知之比量則當於此節中説之詳此法者曰因明學廣有專書茲但略陳綱要立謂能立以宗因喻為能立具立自所知令他知故破謂能破以宗因喻為能破具破他邪知令正知故此能立破皆以因喻成於宗義若宗若因若喻有諸過謬則為似能立似能破善離過謬則為真能立真能破此中要意在於離諸謬似真能立自所知令他亦知真能破他邪知令成正知蓋依第一節中真現比量及比量中所用算數文語工具於某事義之自共相在自心中既成正知觀他心中尚有未知為曉喻他乃有所立或觀他心於某事義所知錯謬為改正他乃有所破若立若破總為悟他而悟他之工具雖非一事若測算及圖表等事主重之端乃在言語文字言語文字發端在名綴名成句積句成論至論乃成悟他究竟之用然則建論悟他將以顯真祛似應有原於現知自然而歸於比知必然之論法以為共同遵循軌式是非邪正乃可判別譬之奕棋必依格子定數及其著法乃有輸贏之結果可言也明此立論法式在西洋曰邏輯在印度曰因明而中國之名學則交紐於現比真似與立破真似間兩者皆未完成蓋因明學雖以量論為據而其所主則在立論之法故屬於論理學至量論則為哲學中之知識論其大部分屬於五明中之內明然陳那之量論注重為因明之依據故於內明之知識論猶未窮極窮極內明之知識論乃在於法相唯識學前於現比真似節中已略言之而此節則言佛陀學中之因明學也二佛陀學之因明佛陀學嘗總括諸學藝曰五明內明聲明因明工巧明醫藥明是也內明為體聲明等四為用明者學藝之謂初節為內明之一分乃因明之依據次即聲明一分第三節為工巧明之一分亦為因明所依佛陀學中之因明學完成在釋迦後千年之陳那等考此學成立之因緣其內因在佛説之內明知識論即四答十四不記墮負等論法阿含楞伽深密暨小乘諸阿毗達磨已兆其端龍樹師弟諸論廣破外小漸具軌式曾專集為方便心論次及無著世親復擯惡空散見瑜珈顯揚諸論復有如實論之編纂而在外緣則有淵源於太古足目論師而成立於釋迦後之正理論為今印度哲學中之正理一派説四宗五分九因二十二墮負處等聲論數論等派依其法皆有理論之發展與佛陀學者相辨論集此內因外緣加以陳那在內明之深悟遂創為佛陀學之因明學復得其弟子天主之闡揚護法清辨德慧戒賢諸論師乃皆依為立論之標準承此論法分傳為支那及印度西藏之兩流派在支那則為慈恩師資之推闡在印度則為法稱天喜寶稱無憂寶作靜法上等之詳審此佛陀因明學之大抵可言者今則更有日本及西洋諸學者取資演繹歸納之邏輯學比較攻錯以相發明在有智者當重詳其短長所在以成為世界之論法三佛陀因明學之實用佛陀學中既以為自求知之方法屬於現比真似之量論通內明因明或通五明之正不正知而以立破真似之因明學專重在為他令知之方法故其實用不同邏輯之用其格式不以自求知識而在設言論以立真破似曉悟他人故邏輯之歸納演繹大抵為依現量成比量依比量成比量之量論即知識論而於因明學為他令知之實用方法多未完密於此一端近之學者皆未認清故於邏輯與因明之比較研究不能知其要領因明學既專在建論以立真破似而令他正知後法稱諸賢於自悟量論則得於悟他因明猶失也故陳那以前之古因明學若瑜伽顯揚集論等就立論之實際立場先加注重蓋立論之實際立場賓主對揚盛興論議將以判決是非辨定勝負宜有共循之軌一者首應區別論之性質曰論體性大別有四一隨俗習之論二故詭諍之論三顯正理之論四為教導之論若審知立場之論衆其所欲立之論在前一種則當隨俗和光置而不言在第二種則為詭辨故興諍謗可謝絶曰既唯詭諍恕不參加在第三種則為立論對辨之真目的乃應如法論辨在第四種乃為先知知後知先覺覺後覺之事著書立説端在乎此故在佛陀學之立論唯取後之二種所謂由大悲智顯揚正理與教導學徒而曉悟他也二者則應審察立論處所凡立論處除立論者應更有對辨者與證義者及旁聽衆證義者之裁決旁聽衆之贊否皆有重大關係故凡論辨真理應在能決是非者前及在樂解法義衆前其證義者應更諳知下二輪軌所批判者乃得其當三者論者應有善成所立論之功德一善知自他宗二音圓滿三無畏四辨才五敦肅六應真善自他宗否為尤要故天主於宗因二支諸過多有依自他宗義之相對上施設者法稱不知因明乃專重對他立論者遂議廢棄四者論墮負相論議結果在立論者或對辨者自知所論辨者有屈於理重真理故發言謝過捨自所論曰捨負相此為光明磊落之易可知負相設或情不甘服聲請暫時思滯容更考慮亦為捨言負相則須證義者為裁決其墮負也如奕棋者託言再奕不認為輸即為輸也其或理言俱屈矯設其他取巧言語以圖混亂於證聽者或偽為靜默等形容以掩飾其窮相曰屈負相則如奕者託事置而不奕甚或發諸不善言辭以強爭軋所謂雜亂語粗獷語含糊語繁簡失當語非義相應語前後不次語屢自立毀語不規則語不相續語等曰過負相如奕棋者之亂其子翻其枰等皆須由證義者為裁決其負也捨於論德為上屈猶不失中德過斯下也按瑜伽等説論處七一論體性言論等六二論處所王家等六三論所依所成二能成八四論莊嚴善自他宗等五五論墮負捨言言屈言過六論出離觀察得失等言七論多所作法第三論所依通現比真似及宗因喻支之所説餘之六處合為今之四軌非此四種共循論軌則雖可以因三相自比求知或閉門著書教導學徒然未足登論壇以論辨也四為他比量之三支佛陀因明學之實用在於為顯正理及為教導之立論以悟他此為他令知者即宗因喻之三支比量也其所立之主義梵云皤囉提若此譯為宗在教導時之聽受衆若能解信而無疑諍則雖不更出因喻亦可矣唯在論場辨揚正理且其所辨揚之正理又必非常識皆了之聲是所聞等義此種立等不立曰相符極成過亦等闕宗支過則必有其疑而對辨之者例曰聲是無常立此宗時其疑而對辨者可詰之曰汝説聲是無常以何理由知聲是無常耶若無理由何以知聲不是常耶我今亦可不須理由説聲是常我言既立汝言則壞由是立聲是無常者繼此須説何故聲是無常之因始能令信乃曰所作性故或衆緣所生故或勤勇無間所發故凡所舉為因者必擇一為對辨者及聽衆所已知或易知之宗上有法所有法乃能使對辨者悟或不能不許然雖已出其因而對辨者疑猶未決則辨亦未能已如曰我亦固知聲是所作性也然何以知聲是所作性故聲不是常而是無常此若未決則雖説所作性為因聲是無常之宗仍未成立故立論者至此又必加引同喻即同一律乃曰如瓶等現見是所作而是無常然疑辨者猶可諍論詰以瓶等所作性者雖是無常汝未盡知諸所作者皆是無常安知聲雖所作而聲不是常耶立論者至此又必更加引異喻即矛盾律曰如虛空等是常者現見非所作今説聲是所作性故無常現有瓶等可證汝説聲雖所作是常無可為證今説若常則非所作現有空等可證汝説聲是常而所作無可為證我言有證汝言無證汝既無證我可證為凡所作者皆是無常聲既所作定是無常故應捨汝無證之虛言信我誠證之正理至此則對辨者於未能尋出是常而又是所作之證據時則不能不捨諍皈服或聲請再思矣屬捨負相故喻梵云烏陀訶羅喃直譯云見邊曰見邊者謂同異喻正反相成極世間智見共喻之邊際至此更不容異知見之存留也由此應可令他疑斷信立捨邪成正縱使邪疑尚存然於邪辨不能不為之屈故於正論可云已盡其能事也然立論之活潑應用不必皆有因喻或但舉宗而置因喻或但宗因而不舉喻均無不可要在令他信解所立之理而止因明學以闕支為過若闕宗支虛言無所立義則誠過也若但舉宗義或宗因他人已能信解不待喻或因喻則雖闕而非過此其立論法之伸縮自由可因對他所宜為靈便之應用實為因明學之特色不同邏輯以現量成比量之歸納法以比量成比量之演繹法但能用為比求自知用之為他令知實際則頗為呆滯也然在立論遺世以悟無限之他則固應以三支圓滿為善三支有闕必將遺人以起疑辨故於闕支皆可言過因明學者歷久研求至約至精乃成定式在三支中宗為立所信義因為出義所由喻為譬曉因義因喻合為成立宗義之具然對顯自知中欲令他知之理則在立量設量救量宗因喻言皆為能立在破量亦宗因喻言皆為能破似能立破則又皆為所破蓋真能破即破似能力似能破之論以顯其為真能破也五宗支之構成宗者所信所崇所立之主義也古分四類一遍所許二先稟承三傍準義四不顧論陳那以後惟取後一或發微言不顧前三或破他宗故違舊立隨自意樂皆第四類雖立宗非為與世間興諍及就自教詭辨必不悖於世智共許所稟自教比知現證而後所宗乃得成立然既遍許不須重立先稟遺教猶應抉擇傍比所準非今正意故惟依現所知正理隨自信崇不顧一切或立或破令他曉悟未知之義建設宗言使世共許及先稟教與旁所準之義而為正理必能不違今此宗義若其彼此相違非彼前三有違正理必此宗義有違正理樂正理故不留情故捨彼捨此都無容心故非於不顧他論宗外別有前三類宗也宗有二分一分是體句中主語正名有法能有餘法以為義故若以句中所敘述者及所出因皆為其所有法一分是義句中敘述正名能別差別有法成別義故二名互相影顯有法亦名所別能別亦得名法此宗二分為總宗之所依謂之宗依亦名別宗合此二分成為一句謂之宗體亦名總宗依別宗之二名成總宗之一句在別宗之二名必為遍所許之名理故非立敵諍論所在非遍所許則須寄言簡別否則成過而總宗之一句必為立知餘未知之句理否則立等不立墮相符極成過乃生起敵論之諍辨故宗所依之二別名必須極成正為宗體之一總句必應有異共知否則不生敵論即不應有因喻無能成因喻以相對則亦無所成之宗可名也以敘述辭差別主辭例云聲是無常以無常義軌範聲故使聲離別於常義外故無常義為能別而聲為所別雖屬二名合成一句於一句中聲亦軌範於無常義使無常義不出聲外可云互為能別所別以相差別然在名句之序列上本以敘述語解主語不以主語解敘述語立意亦在立聲屬無常義不在立無常義屬聲故以敘述為能差別主語為所差別依此能所差別序列上之不相離差別義是為所構成之宗體亦即立敵論諍之所在表解如下所別聲有法宗所依可據為立宗材料之所以法別依必已極成非諍所在無常能別或聲無常宗正體須更用因喻成立之所以聲是無常總體必未極成為諍所在六因支之構成對宗曰因因此能成立於彼宗義故三支之中因是總樞非因則前之宗不成非因則後之喻不生故三支學獨曰因明因有生因了因之別如種生芽種為生因如光顯色光為了因今以因言證了宗義以宗義之證成為果則唯了因若以成他理智為果總括三支曰因因果重重故亦得論言生智耳今取對宗曰因乃唯了因因之成宗其相有三一遍是宗法相遍謂於宗之有法上遍有其法例遍一切聲有所作性故宗之有法雖為宗上二分之一二分別宗亦得名宗且宗上有法為主語正是能有於他法者故此因亦為彼有法之所有法設此因法非遍是彼有法之所有法則所出因與彼無關而不足為因也宗上所立有法之法以自知而他有未知故為敵論所諍今別出一彼有法上共知之法以此共知成未共知故為能立彼宗之因因無此相則墮不成諸過二同品定有相品指宗上所立之能別義例無常於宗之有法例聲外其餘事例瓶等上同有此之能別義處謂之同品此因法之所在必須有彼同品決定俱有之相就因法言應改稱定有同品相即若有因法處定有彼能別義例若有所作性處定有彼無常義也由此於因不了更須證以後之同喻蓋宗之有法上之有因法本為共所知者然有法上有此因法何以決知有法上即必有宗上所立之能別義猶有未知若皆已知則不須乎喻也然此實為最要邏輯之大前提亦依此相而立因無此相則墮相違不定諸過三異品遍無相品亦指宗上所立能別義無彼宗上所立能別義處謂之異品彼異品中必須遍無此之因法若異品中亦可有此因法則成不定之過然對辨者若於此相未知就前例言將曰聲雖有所作性安知聲心無常不是常耶是故引生後之異喻要之所舉因言必須備此三相無第一相則此因非有法上決定有之法不成與宗有關之因無第二相不能決成在總宗所立義之是無第三相不能盡遮與總宗相違義之非成是遮非俱在因言而喻不過重揭因中所含隱之義耳七喻支之構成喻云見邊以共同曉喻法極顯因之後二相也宗因喻三宗出其義因正能立喻則助顯於因故喻亦為因分陳那後廢合結二支但存宗因喻三支者以正反相成之喻支既舉已知因所在處定有宗義同品復知因所在處遍無宗義異品則疑難之問題已決而知識之分別已周故合結可省矣喻有同法喻異法喻之二顯因於同品定有相者曰同法喻顯因於異品遍無相者曰異法喻法指因言因法定有於同義品謂之同法於異義品遍無因法謂之異法凡舉喻支先合顯因義相謂之喻體次舉因義所依謂之喻依復次在同法喻之喻體中乃合因定有於同品應先合能立因後合所立義以見説因宗所隨例前聲是無常所作性故之比量同喻體應言若是所作見彼無常又異法喻之喻體中乃離因於異品遍無應先離所立義後離能立因以見宗無因不有例云若非無常或若是常見非所作極顯因之定有同品及異品遍無相同合異離次第應爾否則有倒合倒離過復次此同法喻之喻依例猶如瓶等乃指現見因義所依之法為證此異法喻之喻依例猶如空等亦指現見因義所依之法為證即事證物證等證據證據既已指出則因有宗有宗無因無之喻體確然不可搖動故因於宗遂能成立然喻體所依之事物唯取其有因法必有宗法無宗法必無因法之相同點以為證非取其事物例瓶等中一切所有點以概同故於喻依但應分別是否有所作而無常或是否常而非所作不應分別宗因上所未説之聲不可見持瓶可見持等義譬於佛面猶如淨滿月言但取光淨圓滿相似為比不應責月有眉目等責佛面有朔望晦等亦齊同也若全責齊殆無全同全異之物堪引為比凡立喻依應知此意然此中之喻體略似邏輯之大前提細按之則彼粗此精不可等視一由因明一比量中有同異喻在邏輯則分成正負之二各自獨立在正無負以為之限既未盡知全宇宙中諸有所作性者安知所作性者不或常耶在負無正以為之限既未盡知全宇宙中諸是常者安知是常者不或有所作性耶故於因可有不定過二由在邏輯言凡所作性皆是無常雖可除不定過然既曰凡曰皆則宗上有法及法亦已概括於凡皆之內非以已知成立未知但依已知戲論已知故於宗可有相符極成過在因明言若是所作見彼無常言若言見故無斯過三由邏輯之演繹法既多缺點雖有歸納法為彌補二者各立未能連貫為一故於演繹法有不經實證之弊於歸納法亦有不便推論之短在因明法若是某某見彼某某如某某等之喻則已連貫演繹歸納為一有如某某等為實證復有若是某某見彼某某以為推論二俱完足既可推其已知以成未知亦容廣驗未知以發新知此三勝點皆在因明之喻故今附論及之八為他比量之第一分類為他令知之比量式先從或立或破之用辭上可分三類一曰共比是正立量二曰他比是正破量三曰自比是立量中之救量或破量中之設量介於立破之間此三分類由所用為有法能別因及喻依之四單辭極成或不極成有所簡而區別極成謂共許者不極成謂不共許者此四單辭本應共許乃可用為構成不共許之總宗復以共許因喻成立不共許總宗為共許故以共比為正立量然在破量所用某辭若唯他許而非自許可用汝執為簡別之在救量或設量所用某辭若非他許而唯自許可用自許為簡別之故於他比及自比中亦可用不極成之單辭也然在正立量中若唯取一分超俗間之共許辭可用勝義而簡別之若唯取一分共許者為共許辭可用極成而簡別之然亦為立量中防難之救量也由此故成多式茲舉數例為證真故極成色不離眼識宗自許初三攝眼所不攝故因若是自許初三攝眼所不攝者見其不離眼識同喻體猶如眼識同喻依此為立量而兼救量之例此中色是有法眼識是法色不離眼識是總宗色上真故明依勝義不依世俗既有此簡可防俗間之難以此所言非俗間所執離眼識而存在之色故極成明依大小乘所共許之一分色不依小乘不許之他方佛色等既有此簡可防小乘之難以此所言非小乘所不許之他方佛色等故因上自許明依大乘自許初三初三即眼界色界眼識界於色界中簡非依小乘所許佛有漏色等然大乘自許色界中除他方佛色等仍有為小乘共許之一分餘色屬初三攝眼所不攝為宗上有法之所有既有此簡可防小乘之難遂於喻上亦以自許簡之然因上亦可兼用自許與極成為簡如有例云諸大乘經皆是佛説宗自許極成非佛語所不攝故因若是自許極成非佛語不攝者見是佛説同喻體如增一等同喻依此中因上自許極成之簡別言亦為救小乘之妨難而設故此皆為兼救量之立量若純正之立量如聲是無常宗所作性故因若是所作見彼無常猶如瓶等喻所用單辭皆是極成不須寄言為簡別也凡在破量必須以他之矛攻他之盾故皆以汝執言為簡明非自許然因喻或用共許者亦可共許即含有一分他許故唯究以取但他許者為要而用辭上則汝執言但寄宗上即可連貫因喻例云汝所執我應不隨身受苦樂等宗常遍故因若是常遍應不隨身受苦樂等同喻體猶如虛空同喻依汝執一言雖寄宗上可貫因喻因上亦可言汝許常遍故喻依上亦可言如汝所許之虛空等然亦有於因或喻上復加汝執汝許汝計等言以簡別者例云汝明論聲應非常住宗許能詮故因汝計我與身合無和合義宗無方分故因如汝所許色等諸德同喻依許能詮故即於因上復加汝許為簡之例如汝所許色等諸德即於喻上復加汝許為簡之例此皆純正破量然或有加我意言簡我意猶云自許設量以先定其執而後破之者則為兼設量之破量例云汝明論聲應非常住宗我意汝應許是能詮聲故因如彼含義許是能詮而未明言是能詮者則可用我意汝應許是能詮聲故以規定其執逼其承認為所許因助成破量又破數論量云我意汝計眼等為非積聚他用然汝所計為他用之眼等應為積聚他用宗汝許積聚性故因如汝所計為眼等用之臥具等同喻依又破勝論量云我意汝計有性作大有緣性説非實非德非業然汝所計非實非德非業之有性應作非有緣性宗汝計有一實故有德業故因如汝所計之同異性同喻依凡此兼設量之破量皆因所須破除或用以為破者不在其言陳而在其意許故須用我意汝言之含義如何揭出其意許而先定其執然後破之以從其言陳上殆無瑕可疵也由此立宗可開四式立法體有法自相立宗言陳法自相立法義立法上差別義法差別意許立有法上差別義有法差別雖此種應用極不多亦必備此一式乃全其用綜上所論為他比量第一分類分列如左即能立正立量辭皆極成無須寄簡立量準正量於宗等上用勝義或極成簡之兼救量之立量救自量於宗等上用自許簡以助立量助量設他量於宗等上用我意簡以助破量即能破兼設量之破量破量於宗等上用汝執汝許汝計等簡之九為他比量之第二分類就用辭上遮表立遣別所詮法體之有無是為第二分類大抵有體用於立量無體用於破量就宗有體無體可成四式一聲是無常有法之聲有體能別無常表立有體宗二眼等識非異熟心眼等識有體非異熟心遮立此但破量三汝我有用應無常外執之我無體能別無常表立無體宗四真性有為是空真性有為無體能別之空表遣因順成宗表立遮遣所詮法體亦判有無然於因法廣百論釋分為三類一有體因如所作等二無體因非所作等三俱有體無體因如所知性等由此乃成六式一有體因成有體宗如所作性成聲無常二有體因成無體宗此但破量如有一實故成汝有應非有三無體因成有體宗如聲論以非所生故成聲是常四無體因成無體宗亦但破量如非有實等諸法攝故成汝執和合定非實有五俱二因成有體宗如所知性故成聲不離識六俱二因成無體宗如所量性故成兔角不離識同喻異喻之對於宗合立離遣所詮法體有無亦須順成故有體宗同喻亦須有體異喻可通有體無體有法無法又無體宗同喻亦須無體異喻可通有體無體有法無法其例如下聲是無常所作性故同喻如瓶異喻如空同喻之瓶有體順成於有體宗異喻之空實空論者有體無空論者無體然皆遣無常義故有體無體皆得成離遣第一義中彼內入等皆有自體由起自他差別言説因故譬如因長有短長為短因此量般若燈論破云第一義中短長無故同喻不成此出以無體同喻成有體宗過數論立我是思不出同喻廣百論釋破云以其思相唯在於我不共餘相缺同喻法此出同喻無法成缺喻過汝執和合句義定非實有如畢竟無同喻之畢竟無無體順成於無體宗此在破他之量應爾真性有為空緣生故如幻無異喻法掌珍論自解云為遮異品立異喻法異品無故遮義已成是故不説故無異喻法不成缺支過綜上所論為他比量第二分類分列如左十為他比量之構成由上所言可知為他比量之構成式凡在論壇對揚及立論傳世等皆必具足三支及離三支諸過缺支又有缺支言缺支體之過言謂能詮之言體謂所詮之法支言支體兩俱無缺為他比量乃得構成所構成者於宗支又須具五條件如左枋違則不成一不悖世智但可用勝義以寄簡二不悖立宗所依教義但破他量可用汝執等簡三宗中之有法及能別為言相順四有法及能別辭皆屬極成但可用勝義極成自許等簡之五不顧遍許等宗於因支亦須具下四條件違則不成一立敵俱許遍是宗法二因法自體俱許成就但可用自許極成汝執等簡之三因體有無與宗相順於破他量或不相順四同品定有異品遍無於喻支中亦須具三條件違則不成一同喻法宜有能立因所立義異喻法宜離能立因所立義二同法喻顯因義言宜先合能立而後所立異法喻顯因義言宜先離所立而後離能立三同喻法體有無宜順宗體異喻有無不拘三支言體無缺於宗因喻具此十二條件或能預作方便言簡離過則為他比量乃完全構成可真能立及真能破十一似為他比量之過謬除去缺支言過缺支體過即在宗等過中宗支違上五條件故乃有九種過謬一違世智現知曰現量相違過例聲非所聞二違世智比知曰比量相違過例瓶等是常三違世智共許曰世間相違過例懷兔非月四違立量言所依宗義曰自教相違過例勝論師立聲是常五宗中之有法與能別為言不順曰自語相違過例我母是石女六宗中能別辭不極成曰能別不極成過例佛徒對數論立聲壞滅七宗中有法辭不極成曰有法不極成過例數論對佛徒立我是思八能別辭有法辭俱不極成曰俱不極成過例勝論對佛徒立我為和合因緣九總宗隨世遍許或隨他意曰相符極成過例聲是所聞此中八九亦缺宗過因支違上四條件故有十四過又分三類一不成過有四一立敵兩俱不許因是宗法曰兩俱不成過例佛徒對聲論立聲無常宗眼所見故為因二立敵隨一不許因是宗法曰隨一不成過例佛徒對聲顯論立聲無常宗所作性故為因三因法自體疑似未定曰猶預不成過例立遠處有火宗有煙霧等故因四因有宗無體不相順曰所依不成過例勝論對無空論立虛空是有宗德所依故為因四不成過皆從因法非遍是宗上有法之法而成過犯因三相第一相者皆同缺因支過二不定過有六五同異二品俱有此因曰共不定過例聲論對佛徒立聲是常宗所量性故為因六除有法外於同異品俱無此因曰不共不定過例聲論對佛徒立聲常宗所聞性故為因七同品分有異品全有曰同品一分轉異品遍轉過例聲生論對勝論立聲非勤勇無間所發宗無常性故為因八與前相反曰同品遍轉異品一分轉過例勝論對聲生論立聲是勤勇無間所發宗無常性故為因九同品異品俱一分轉曰俱品一分轉過例聲論對勝論立聲常宗無質礙故為因十因相雖具然相違因亦具三相使成猶預曰相違決定過例勝論對聲生立聲是無常宗所作性故為因如瓶等為同喻聲生違其量聲是常宗所聞性故為因如聲性喻六不定過皆從因法非同品定有異品遍無而成過犯因三相第二第三相者然第六相違決定過則以能引生相違宗之因而亦成過若佛徒對聲生論立則不成過佛徒不許有所聞性之聲性故三相違過有四十一反成相違宗曰法自相相違過例聲論立聲常宗所作性故此因成相違宗可違之云聲是無常所作性故十二成法自相雖似無過然能成法差別之相違宗曰法差別相違過例數論對佛徒立眼等必為他用宗積聚性故為因如臥具等數論在成必為非積聚性他用然佛徒可違其量云眼等必為積聚他用積聚性故如臥具等十三違害有法遣彼自體曰有法自相相違過例勝論師對弟子立有性非實德業宗有實德業故為因此因違遣有法自體佛徒曾設量云汝之有性應非有性有汝實德業故如汝之同異性十四因成於法雖似無過然亦能成有法差別之相違宗遂壞所立曰有法差別相違過例前量之有法上有差別義立者意在作有緣性可違之云汝言有性應作非有緣性有實德業故如汝之同異性四相違過總為同品不轉異品遍轉分轉之過亦犯因三相之第二第三相者喻支違上三條件故有十過謬先出同喻五過一喻上無能立法曰能立不成過例聲論對勝論立聲常宗無質礙故因猶如極微喻二喻中無所立法曰所立不成過例前量改喻如覺三喻中能所立法俱無曰俱不成過例前量改喻如瓶曰有體俱不成又對無空論者改喻如空曰無體俱不成四喻中雖有能所立法而缺合言曰無合過例聲是無常所作性故喻云如瓶見所作性及無常性五喻上雖有合言而違次第曰倒合過例前量喻云諸無常者皆是所作如瓶正喻例云若所作性見是無常如瓶此皆不爾結成五過次出異喻五過六喻上有所立法曰所立不遣過例聲常無質礙故異喻如極微七喻上有能立法曰能立不遣過例前量異喻如業八喻於能所立法俱有曰俱不遣過例前量對有部異喻云如虛空九雖遣能所立法無有離言曰不離過例前量異喻云如瓶見無常性有質礙性十雖有離言而不次第曰倒離過例前量異喻諸質礙者皆是無常如瓶正喻例云若是無常見非所作如空此皆不爾結成五過綜上宗因喻過有三十三並缺支過在窺師之因明大疏廣分全分自他綺互復沓演成多過茲不詳述十二似能立與似能破於佛陀因明學能立能破之式既經明晰乃可觀察於似能立似能破量以離似過及為所破能立之立量為悟他以正能破之破量為破他之謬皆為對他令知正謬而設若所立非正所破非謬或對他而不善他宗及不當他機其立量遂為似能立自立不成反被他破其破量亦為似能破破他不成反被他破或缺支言成過缺一支之過有三種於宗因喻隨缺一故綺互缺二支過亦有三種於宗因喻綺互隨缺二故在缺支言不成缺三有一之過以三俱缺同默然無説故既默然無説則無從出其過故故俱缺宗因喻三之一過但指缺支體言支體之缺即在宗等過中且宗因喻三支體俱缺者其例難舉故缺支過唯存六種於六種中隨犯缺一支過即為似能立破反被他破又能立量違前宗因喻上十二條件不善寄簡犯前所言宗支九過因支不成四過因支不定六過因支相違四過喻支十過墮似能立其能破量立量妄出他量缺支及宗過等六類之過他實無過及自犯於缺一支及宗過等六類之過墮似能破天主入論之後似能立似能破諸過以皆攝入缺支等六過類故唯以六過類顯其為似然足目正理論説二十四種墮負處方便心論略為二十如實論又加為二十二種陳那於因明正理門論中據最極成提其大綱約為十四相似過類皆顯出相似過實不成過致反墮於似能破者具如論説須再尋研然核對之仍未若缺支等六過類之完密故質言之無論立自破他之量若犯缺支及宗過等六類過者即為似能立及似能破也十三真能立與真能破若能立自知正理悟他之立量於宗因喻支言無缺完備宗等十二條件於所對他善知他宗及機所宜巧能寄言簡除諸過於宗因等三十三過無一違犯乃得成真能立若奘師真唯識量云真故極成色不離眼識宗自許初三攝眼所不攝故因若自許初三攝眼所不攝者見其不離眼識同喻體如眼識同喻依若離眼識見其非自許初三攝眼所不攝者異喻體如眼根異喻依若能破他量謬執悟他之破量自於支言無缺亦於宗等三十三過無一違犯而善能出他所立量缺支或宗過等乃得成真能破此真能破凡有六類一出缺支過能破有六種二出宗支過能破有九種三出因不成過能破有四種四出因不定過能破有六種五出因相違過能破有四種六出喻支過能破有十種六類總有二十九種能破然能破法但破他義因明不以破他為立非破他義己義便成故破他量異於立量但能破他即真能破由此能破乃有多式一出量破此有二式甲破量違他用他許法汝執言簡可成能破例汝執上帝應無許非物故如龜毛等有法雖非自許共許之事得成破他此亦名違宗破能違彼立上帝是有宗故乙破量顯因不定相違過者自雖不定相違亦成能破例前因不定過中之相違決定後出破他為勝以破他量但破他義不在樹立自義雖以不定相違未能成立自義然以不定相違已能達到破他目的故在破他已成能立此亦名同彼破使彼同墮於不定故二出過破此有六類二十九種全分自他綺互更成多式不必出量但於他量審其所有缺支及宗等過若能指出其一他量即破例數論立我是思指出其缺同喻法過即破其量成真能破三襲擊破蹈隙抵懈突襲截擊或指事而無言或片言而破的或反覆縱奪使他所立義進退失據雖則自無所立能令他義墮於所破即成能破四關並破設雙關語使他任受一關即壞所立例長爪梵志向釋迦立一切法不受宗釋迦詰云此語受否若受此語則自壞其一切法不受宗已受此一語故不受此語則便自無所立宗語更何論辨於是梵志默然而服此一名勝彼破使彼受有違宗之缺不受有捨宗之失故由此因明之法能立為艱能破為易若不居能立之地位而專為能破之詰難雖不易於失敗亦易流於詭辨故凡他義被破之後他人例得反詰之曰非破他義己義便成我義不然汝義云何於是能破之地位不得不轉居能立立其自義任他攻破故曰他量自破自量他破共量共破必無可破乃得成真能立必真能立然後所破皆真能破十四立破真似刊定因明學立破真似之法式辨晰既了則於古今傳布之説或在於立自義或在於破他義皆可審其為真為似刊定孰是孰非言其方隅次第有七一審其所言於三支完具否若為異式演繹觀之由此若見缺支言過則似非真支言無缺再觀餘過二審其孰為立敵所諍宗義何在若所諍相符則失其應諍由此發見立宗相符等過則似非真宗義應立再觀餘過三審其三支法體有無是否相順由此若發見缺支體等過則似非真支體相順再觀餘過四審其三支或有言簡是否得與立破相符由此若見所破不極成因不成缺同喻等過則似非真無此諸過再觀餘過五再審宗支有無餘過由此若見現量相違所依不成等過則似非真無此諸過再觀餘過六次審因支有無餘過由此若見不定相違等過則似非真無此諸過再觀餘過七後審喻支有無餘過由此若見倒合不離等過則似非真諸過都無乃真能立能破依上七番審察過無遁形有過則似無過則真由是得以總判三支孰真孰似究竟楷定然三支上寄言簡別所關殊大真能立破之量往往因缺簡或簡言失當致墮似比量者勝軍立諸大乘經皆佛説宗兩俱極成非佛語所不攝故因致為小乘一切有部出因不定之過得玄奘法師改兩俱極成為自許極成其過乃除清辨宗中觀立真性有為空緣生故如幻一量為瑜伽宗出其多過然若於真性上更加自許言簡則離諸過故諸簡言殊有深用否則專精之義殆無從立第五節聞量與能知方法之評判一聞量概説瑜伽八十一云一文二義文是所依義是能依如是二種總名一切所知境界除依現實事理求知更應依古今所傳文義以求知故有聞量量即比量現量之量指符事理之正知言聞思古今學説言教所詮事理得成正知謂之聞量如各宗教各有其至教量陳那量論中雖廢至教量以就正知之種類言至教量之正知亦不出現量比量之二種故將至教量分別攝入現量比量中不鼎足立至教量為三耳非棄除至教量而不顧也然今曰聞量復與至教量廣狹有殊至教量唯是各宗派指其自所尊崇之教典言如佛教之指大藏經基督教之指新舊約回教之指可蘭經等又科學家指科學者公認已經證實之公例等今曰聞量則遍指凡遺傳所聞學説言教時無間於古今人無間於此彼據吾今可依現量比量所知現實事理而建立名言有能令他人得起正知者即可推比決知聞於古近他人所布名言亦必有能令吾及餘人得起正知者復據吾今所言間有乖違現實事理而不符現比正知者即可推比決知聞於古近他人所布名言亦有乖違現實而不符現比正知者故應據現量及為自為他比量測以算學考以聲明觀察詳審研核判定遣其偏妄存其圓實所存詮圓實事理之言説乃可依以勤求自悟亦可用之令他得悟故既明前四節之能知方法後次當評判聞量二四依四不依之標準大牟尼嘗以四依四不依之言留贈後人以為審擇聞量標準超越世間諸立説編書者偏執自言為至教量致生後人依人依語不依法義而諍門戶之見其純依現實真相之公平態度真足令人欽服無已四依四不依者一依法不依人法指能詮名言或復兼指所詮事理或復兼指能知智識所知境相法言通故表於左枋能詮名言即語所知境相了不了義法所詮事理即義能知智識即現比量及量非量之分別識依法為總依義了義及智為別依法不依人者謂當以法定人不當以人定法縱使其人行果淨善然其所言無義不了不合正智亦不當取或使其人行果穢惡然其所言有義明了驗合正知亦當聽取高至佛言低至童話不問何人所説皆當持此標準以為衡量乃能正知現實真相云以法定人者披擇片言之善雖童話中亦時有堪選者然使所言多分堪取則可定其人為智人遍觀所言除隨別機方便而説全分堪取則可定其人為一切智人一切智人所言遂為至人之至教量吾人崇佛陀為至人崇佛陀言為至教量乃由於此異於聞為誰之言故即信不信此其即信固為盲信其不信亦為盲不信以人定法依人而不依法正此所揀然有情之智幼稚者恆不免斯咎也由此世人多盲信盲不信堅執難喻故求正知應先去此盲執又牟融理惑論謂善言善行人之聖不善言不善行者人之賊善行不善言人之寶善言不善行人之師善言善行人法俱至固為最崇善行不善言雖可寶若二乘聖人不能説法者亦為人天福田然其所言或無堪取善言不善行雖未為至人然其所言亦堪師法依於後例故羅什法師誡學徒云吾如敝囊然中有金但應取金莫觀囊敝又龍猛師亦説喻云如黑夜行遇敝惡人執燈同行可依敝人取光前進勿須違避能知此依法不依人之例遍觀所聞言義可以無善法而不取得大自在亦可無誰人之能障得大解脫極如古錐呵佛罵祖亦不過欲學徒依法不依人耳二依義不依語法中分能詮之語與所詮之義凡語言多分隨俗間之流行語而敷施者雖創新語以詮新義既成流布即多應用核其所詮時有歧異故不應取單言片語隨先所聞於何處者封固堅執謂於某名必為某義封名取義應觀某名在某經論中前後諸多文句所關屬之義其義應當若何依義定名例若真如一名於法相唯識經論內依名相分別正智真如之五法但詮所知現實真相之義於起信等論中以未詳五法分別故乃總指諸雜染法曰生滅指諸清淨法曰真如包括正智真如統名真如真如一名詮諸清淨法義諸不了斯例者遂生紛諍故應依義而不依語三依了義教不依不了義教合上能詮所詮辨其了與不了了義語謂顯義究竟明了之語不了義語義雖究竟無過語有不明了過語不明了義隨含混易令他人生迷謬解義語俱不了者更無論也例起信論真如一名詮諸清淨法義語欠明了遂多謬解成唯識等於真如名但詮無分別智所知法性語義顯了究竟決定又如清辨等説真性一切皆空雖是遮詞但皆空語混同表詞易生空執不如護法等説真性非空不空非空不空顯然唯是遮詞雙遮空不空執語義顯了究竟決定是故自悟悟他為求正知而防謬解應依了義言而不依不了義言四依智不依識現量或真現比量曰智比量或似現比量曰識復次超俗真智曰智即真現比量世間常識曰識即現比量帶有迷謬之似現比量然此智之與識重重隔別茲表如左俗情科學正為生物人類宗教正為人類超人天人旁及生物哲學正為人類旁及生物超人小乘正為小聖旁及人類超人大聖大乘正為大聖佛陀旁及小聖超人人類生物以生物情識為世間常識人類理智即為超俗真智科學等皆有之且唯科學為其特色故吾人轉識成智之進化以科學為基礎然以宗教哲學上一分之超人靈智為超俗真智則人類理智亦降為世間常識而進以小聖偏智為超俗真智則超人靈智亦降為世間常識再進以大聖分智為超俗真智則小聖偏智亦降為世間常識進至以佛陀圓智為超俗真智則大聖分智亦降為世間常識生物純識佛陀純智大聖小聖智中帶識超人人類識中帶智此其大較之可言者依智不依識者即吾人須進求顯現證知與推比決知以驗所聞言教之符現實事理否乃為決定評判未可憑其俗情常識以妄衡量故終之以依智不依識也雖然據吾人遍觀所聞語義法而測定人法如諺云世間好語佛説盡則佛陀為至人佛陀所言為至教量亦其大較可言者也三歷史之考證吾人整理所聞言義就依法不依人言本不須為歷史之考證然為以法定人起見既不能不考尋某法是否為某人之所説某人之所説是否為某法則不能不為歷史之考證故當依記載之聞量驗以現存發見古器制之現量參以人種民族語言文字及時代國土社會環境種種關係之比量然後觀察其分位上應否能有此人此人應否能有此言此言之思想上來源何在此言在當世及其後曾發生何種影響與功罪更加古記載之詳稽博證某種語言文字上此言之所詮應為何義某種風俗習尚上此人之所言乃為何事於是茫昧而不明了之傳説乃略有眉目可為論其世察其言而知其為人之基本雖然有因於自然界之環境關係者如以氣候地帶物産而演成一區之民俗各營其特共之生活有因於人群制之環境關係者如以種族階級信仰而演成一區之民習各循其特共之軌轍有因於時勢之轉機關係者如以貧富強弱安患而改換勤惰憂樂之民情有因於天才之非常關係者如以聖哲英豪而變化仁暴智愚勇怯之民性中人以下之言行大抵以前三因而發生為歷史退滯之迹象中人以上之言行大抵以後一因而發生為歷史進展之迹象故觀歷史之進展必以後一關係為主因而前三因則僅為其助緣夫同一孔仲尼時代之中國為孔仲尼者僅孔仲尼之一人同一釋迦牟尼時代之印度為釋迦牟尼者僅為釋迦牟尼之一人同一亞里斯陀德時代為亞里斯陀德者僅亞里斯陀德之一人有孔子而有儒家之文化有釋迦牟尼而有佛教之文化有亞里斯陀德而有西洋哲學科學之文化可知非常天才之關係為文化進展之主因也唯前三因亦未嘗非輔成其人言行之助緣耳如處於溫暖之地帶居於有憑藉之階級適變於當時之機勢皆有關係然若略去其非常天才之主因必不能為充分之説明也古人之好為歷史人物誇張者固多迷謬而近人之治史學者但索某人某文化之因於前三者之助緣昧其主因亦成偏缺由是今人之愚者每不能逾於古之中人而古之聖哲亦不妨度越於今之智者也以其為非常天才故然解釋此非常天才之何以有或原本宗族之遺傳或推由教育之修習或歸為環境之關係而此亦為其助緣耳然直抉其主因既無上神真宰之特降亦非無端突然而忽至蓋由無始恆轉之一切種識積久修因之所致於此遂至歷史學之問題深處若能以其果之閎偉察其因之深廣亦非甚難知者後當廣論今姑止此由此小乘大乘之俱源於釋迦所説可無疑也結集之歷次增減宜傳譯釋闡發等之遞時盛衰復有前説四因之迭相更替而推演或為退滯或成進展為歷史之考證者勿執一曲以概其大全詳細觀察審求其故庶能得其真相為佛陀學之歷史考證應如此為餘學之歷史考證亦應如此四法印之楷定言法印者所求得某文化能詮所詮之綱宗也握厥綱宗以觀某文化之言義如潔繩而網目齊張如振領而衣紋皆直刪落其無關者統括其有關者內容則條分而縷析外延則此明而彼辨是非真似舉無遁形佛所説義雖復無量古師嘗概括為三乘共通之三法印大乘別有一不共之法印則諸法唯識也或法界諸法唯心説三法印者一諸行無常印有情無情一切因果生滅相續依此而説今廣其義曰無始恆轉論或無常真常觀二諸法無我印有為無為一切緣顯幻事空理依此而説今廣其義曰無性緣成論或無我真我無性真性觀三涅槃寂靜印有得無得一切究竟顯了真相依此而説今廣其義曰無相真如論或無相實相觀大乘不共之諸法唯識印則種現熏起之宏紐染淨轉依之總根也今廣其義曰無元心樞論或現識熏持法種觀持此四法印以觀佛陀之言義則綸貫無遺矣符此四法印之楷定則是佛法違此四法印之楷定則非佛法判然可分無容假借他若諸受皆苦或有漏皆苦觀身皆不淨或有漏不淨觀則由一分無常無我觀所派生用之對治貪癡等煩惱者非普遍之真理名相分別正智真如五法則名相分別非佛法之所專有遍計所執等之三性則遍計所執非佛法為佛法之所破依他起圓成實雖即佛法俗真二諦俗諦亦通世間之説故皆非佛法之法印唯佛法有此刊定是佛法非佛法之法印故異生情愛之魔説俗情科學等與外道神我之梵説宗教哲學等皆不能亂而莫不能化也其餘一一文化之所言義若能尋得其綱宗之所在規定其內容楷別其外延則皆可審知其底蘊選擇取捨分別收破攝而化之莫能踰也析而揀之莫能濫也於是乃能評判一切所聞言義五佛陀學之內容瑜伽攝釋分中以經體之文義經釋之法要十二分教等等起義相釋難次第之五重合為師説衆聽三事加略廣讚佛及顯學勝利以開示佛陀學內容攝異門分則以白品之佛及弟子所説所行法黑品之生死煩惱等顯其內容攝事分中則攝之為三事一素呾纜事經藏二毗奈耶事律藏三摩呾理迦事論藏經藏又分為行處緣起食諦界菩提分法之七列之如左行事素呾纜事處事緣起事毗奈耶事食事諦事界事摩呾理迦事菩提分法事三總七別共為十事然依雜阿笈摩及攝事分可總攝為三相四分十誦九所知事十誦三相四分九所知事佛所説誦能説相佛及弟子所説分説者事弟子所説誦有情事五取蘊誦受用事六處誦生起事緣起誦五取蘊等相應分安住事食誦所説相染淨事諦誦差別事界誦菩提分法分所説事念住等誦為説相結集分會衆事八衆誦如是三相四分九所知事十誦總明佛陀學之內容亦為總攝三寶説者中之佛為佛寶説者中之弟子及會衆中之八衆為僧寶所説相中之七事七誦為法寶有情受用生起安住之四為雜染事染淨差別之二為雜染清淨共通事菩提分法為清淨事佛所説法不出於此三事八衆則瑜伽説為苾芻衆苾芻尼衆塢波索迦衆塢波索夷衆剎帝利衆各國之國民衆婆羅門衆各教之教徒衆四天王衆天衆忉利天等天衆以忉利天等其以上諸天前二為僧後六非僧前四為已受佛戒之弟子後四為未受佛戒之聽衆前六為人後二為天前七總攝人非人等四天王衆亦攝神生旁生餘生等擁護佛之八部衆亦攝在此也後一純為天衆佛及弟子為之説法而教化者都攝在此八衆中故如此佛法僧三寶總為佛學之內容六所聞言義之揀判往者智光論師據西域記智光乃戒賢之弟子等宗般若為一切法有時境空心有時一切法空時之三時判戒賢論師等宗深密為有時空時非空有時之三時及八宗判小乘六宗大乘二宗天台宗法華為五時四教判賢首宗華嚴為五教十宗判或判大小或判半滿或唱一音無所分判要皆就佛説評判者嘉祥三論玄義為外內小大之分判慧苑以四教判佛法外之説為迷真異執空海以十住心判世間共法為異生羝羊愚童持齋嬰兒無畏三心則皆就佛説世説而遍評判者今此聞量評判不限佛説亦當就佛説世説而均判但今所聞一切言義量異昔時故評判之標準亦應不同今先列表再分解之傳説為情識法乃未經理知等訓練之直覺等憑其官感情欲意識有所知覺想像之言説也其雜有科學等成分者亦旁通於理智法科學哲學皆以理知法為主幹然科學旁通於致富圖強等情識法而哲學每推到宗教之最高點故亦旁通於靜慮法孔老及勝論數論等則宗教而哲學哲學而宗教者耶回梵等宗教雖淺深不一而要皆以近於靜慮之靈感等為主者故屬於靜慮法然亦旁通理知以為説明其低等者且每流於情識凡此皆為世説昔嘗謂之人間兩般文化甲種為宗教及人生哲學乙種為科學及自然哲學撮為二表如下理知上在離言契性甲行為上在克己崇仁信向上在融迹同本人間兩般文化理知上在藉相求知乙行為上在縱我制物信向上在取形棄神甲實事善體存性利乙虛理利用厚生人間兩般文化甲妖怪苟惰沉迷弊乙封蔽憤爭失望由其弊而揀之判非佛法無得而濫之者佛陀之學為淨智法小乘為出離煩惱障之淨智法餘大乘教皆為出離煩惱障所知障之淨智法然其自度度他之聞思修方便亦依據及施設理知靜慮之法佛法與世説別嘗説四條一來源有聖心凡識之別二施設有應機隨執之別三法體有有漏無漏之別四法用有著言離言之別或説無漏有漏現證推度究竟不究竟之三別茲但言其大概不遑詳也七所聞言義之攝判欲於佛法之統攝中以判別世界各學説昔者嘗製一表如下宇宙即法界也幻化與真如為法界之二面幻化即真真如即幻化也然真如不可説心言絶故可説者即為幻化之一面可説之幻化中分為實事與假理之二幹假理乃貫通於實事上所附現之虛分位大乘百法中謂之心不相應行分位假法故即知識論聲明算學因明等方法實事指有實力用者亦分二幹心即八識心法及諸心所有法色即五塵五根及法處所攝色細別之雖亦通假實而大類則皆為實法色理集現為研究之對象則為天體地質等物説明之即天體天文地質地理學等由物而研物素之色色由心變亦通心力則為物理之力學與物化之質學等物之直接及心力關係而有生命現象者為植物物之由心色理集現者為動物動物與心之間乃有心理學研究之對象動物中較為優勝者則為人類合植物動物人類為生物學研究之對象包有植物學動物學及生理學形態學等專在人類一方有人類學人種學歷史學等一方則有社會學宗教學知識論等在此一方又可由人而達於超人超超人人類原為動物亦可進於超人故人類居於動物與超人之間在社會學宗教知識論之三者各有三種階級中人以下近於動物之人其社會則以貨利或食色為中心乃為經濟學研究之對象其宗教則為拜物為神之多神宗教其知識則為隨感官情欲意識而知覺想像之直覺情識亦能産生美學文學及相似之哲學若今之共産主義是中人正為人類之人其社會則以政權為中心乃為法政學研究之對象其宗教則為拜天為神之一神宗教耶回等教其知識則為以算學論理學等訓練意識察驗物象之理知直接産生者為科學間接亦能産生改進之哲學文學美學宗教等一神教之拜天為神本出於相似哲學之理知對象非官感覺知之情識對象然科學理知進步之結果亦能推破於一神教以漸知唯是內心靜慮之經驗如詹姆士等之所説無別超宇宙外之一神故猶相似哲學之進步亦能推破拜物為神之多神而進拜於天神也中人以上近於超人之人其社會則以善德為中心乃為倫理學研究之對象若孔子所謂道之以德齊之以禮者其宗教則為即人是神之汛神宗教若儒家道家所説聖人神人及人皆可以為堯舜等即為崇拜之對象且所謂賢希聖聖希天而聖人亦即是天神人皆可為人皆可由困學勉強而致自信自成不須別為崇拜一天神也其知識則為經理知訓練善德踐修後心意和平統一之靜慮直接産生者為禪學禪那即靜慮靜慮即心意和平統一中之精思妙慮亦即儒書知止而后有定定而后能靜靜而后能安安而后能慮慮而后能得之總名孔孟荀莊等皆説有靜慮之學印度瑜伽耆那各派尤注重之間接亦能産生及改進美學文學哲學科學等經理知善德靜慮之訓練以加無漏淨教熏發無漏淨種而起現行成超超人其社會則為清淨和合衆即律宗學所研究之對象其教即為佛教其知識則為離煩惱障或離二障之淨智直接産生者為大乘之禪宗學為無漏之禪學展轉增上為真言淨土學乃無漏之美學為華嚴天台學乃無漏之文學為法性空慧學乃無漏之哲學為法相唯識學乃無漏之科學由此可見佛陀所説之法可以含攝人間一切言義而於佛法中各豫以相當位置有條而不紊也宗教哲學之於知也其依根覺印象及所傳聞不異俗情但稍能應用比量以判擇傳聞及改進根覺等靜慮學然亦為較進步之似現比量耳近世依科學之哲學漸有正比量智科學極重依根覺親驗印象之現量亦注重應用考證以判擇傳聞之説尤極注重應用邏輯以構成於正比量之理知如關係公式之知識且能憑所發明之公式等創造望遠鏡顯微鏡析光鏡透礙鏡擴音器及天文化學各儀器等廓增根覺親驗之境都入算學測量文語傳述之內重重改正重重進步故論世間求知方法科學比較優良然於根覺本身六根八識尚無改進之道復不知宗教哲學中之靜慮學雖有迷謬猶待除擇然靜慮學實為改進根覺本身之術若能依正理智親驗其事而去其迷謬者即能改進根覺本身引生淨智擴充且明證現量之實境達到能正知現實之目的於此乃為佛學之事亦為進步之廣義科學也近人稱佛陀學為科學之哲學宗教其言諒已而要非虛心求學不為功八能知方法之評判上言現實之能知方法凡五種一為自求知之現比量此於近世為哲學之知識論與科學之邏輯學之一分二測量工具之算學三傳述工具之聲明此於近世為語言文字學四為他令知之因明學此於近世亦為邏輯學之一分五為以評判態度擇取於所聞言義則凡師友講談圖書閲覽皆可為求知方法之一事言厥途程則在彼根覺親切印象經驗之現量應用測量傳述之算術與語文並據因明學之法式評判聞見於師友圖書之學説構成符事理之正比量智重重改正幼稚之現量為進步現量於是迷謬之情漸伏馴至於斷發生真現量智乃能洞見現實真相施設正比量智乃能説明現實真相俗情之於知也但依根覺印象及所傳聞為胡亂構思想像之似現比量九求學之目的吾人求學除開全由旁人強迫使學之外總多少有所以要求學之意思此意思之所在即求學之目的或謂人身須賴衣食住等生活而此人身所需之衣食等須藉知能以造作取得之且現時造作取得人身生活所需之知能乃從全球人類遺傳演進之所成就今欲獲此知能非從事求學不為功故求學之目的不外欲得人身所需以生活耳以此為求學之目的今固不得非之蓋人生最切要之事無過於謀生活擴而極之謂人生所需之衣食等不患寡而患不均社會主義遂以謀全人類得均取生活之所需亦不外達此目的也然使求學之目的僅如此則現今享有遺産不須謀生之子弟或實行社會主義後人類豈遂無求學之目的而不復從事求學乎如曰不然必更有其他之目的或謂人有榮譽之好故富家子弟雖不求衣食孜孜以求學文藝美術等以博官第尚時髦者其目的要在於華貴風雅等榮譽耳極至於所謂揚名顯親之名教及經營於歷史上留一不朽之名者亦不外此前為利此為名原人事上之所恆有今固不得非之然亦有甘凍餓聽戮辱而不倦求學者又何所為乎或謂人性好勝且好特異彼不求名利而求學者欲持己意支配當世之人並得天下後世之驚慕耳此亦抗心高志怪傑奇才者之所為今固不得非之然亦有捐棄名利和樂人情者復何為求學乎或謂人性樂群尤樂人群之治如孔子輩篤志為學莫非因時以求人群之治理耳此更人倫善德之聖近若克魯泡特金輩張皇互助進化之義亦不外此今尤不得非之但茲之四者可總括謂求學之目的在於得此人生之安樂耳然所得之安樂不在於此求學時須在求學後施行事業之成就若未成就或竟不能成就其求學豈不遂成無意義無價值乎或謂人心本是恆久不息向內外上下以求知能者故求學莫非以得知能為目的學即求知能求知能即學求學即手段亦即目的不必更要達到何項之目的便已達到目的故求學之自身即有意義價值且達到其餘種種之目的要皆由求學所得種種知能以達到之耳故求學在於得知能更無疑義近世真正之科學者唯在於此夫求學固以得知能為唯一之目的然原之無根而徵之無驗所謂知者其固知乎所謂能者其固能乎要未可必故云為得知能亦未足以明求學之目的究何在也上來於各家所言求學之目的討究略盡然則求學之目的究何在曰求學之目的無他為得如如相應於現實之知能而已現實即大涅槃真如現實之知能則大菩提也故求學之目的即佛學之目的若明求學之目的而求學則終將唯佛學之是求也然在現實本離名相今既方便立現實名且更方便定現實知能義則如何為現實之知能可明矣第一義知能一知得現實圓常之真義者根本無分別之如理智力二能得境相確適之實事者後得正分別之如量智力三等得性相理事圓常確適之現實者無上正遍覺知既勘明求學之目的在得符現實之正覺今更進問求學之方法當何從十求學之方法言求學之方法換言之即求正知之方法於此當先認清兩事一求正知之困難二求正知之歷程所言求正知之困難以知覺之不易真耳知覺之不易真以其起原之蒙昧也知識之起不出三源一曰現量二曰比量三曰聞量根本起源唯此現量現量乃是心依內根映帶前境但有人生即由心惑譬之夢事由睡眠起內迷有根身之我人外惑為質相之物境雖不盡無已非如實況復曾未相應旋興念度顛倒執取益滋迷謬習非成是宛成妄知雖有比量可從糾正科學但比量仍依一一現量展轉推校集聯而得成縱能近真亦不切實況復本既不齊末何能整謬非在所必多至於聞量傳由他人他人之現量相及比量名其不免於過非彼亦猶此故一以正知真覺為求學之目的求學即不免有如上之困難解除此困難者則應知求學之歷程所言求學之歷程者以非求得真實現量則不了達現實然在未得真實之現量時所起無非錯謬且於其中絲毫不能用力將如何求之乎曰所賴者一在人心有本能真實現量之潛力無漏種二在已經得真現量之人曾有所垂教於吾人已成真現量者為誰曰為佛陀吾人若依佛陀所垂示之至教圓達其理楷定其量用以裁斷若聞他言若起自覺之種種知識等掃空一切不正教理及謬誤之理想由至教量轉成自心有力之真比量再憑此勝解之真比量力摧伏依附現量所生一切謬非情識久之豁破幽迷便得真現量智由此依真現量智及正比量智續銷虛妄深證真實至於究竟圓滿無不洞然正覺之中方為學滿即成就如如相應於現實之知能也故求得正知之歷程一揀擇於一切學者之學説以求得至極圓滿之教詮定量二依所得至教量破除一切若他傳若自起之迷謬執自成殊勝之正比量三依所成正比量決定印持平常見聞動靜之身心日用事開發真覺四依真覺正思以銷落餘妄究竟顯現五依真現量之智境施正比量之教義令未覺者藉之以覺合前求學之目的與求正知之歷程為現實主義能知之方法
